name = "onboarding-tasks-worker"
main = "worker.js"
compatibility_date = "2026-08-21"

# Secrets are set with `wrangler secret put`, never committed:
#   SUPABASE_URL                - https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   - service role key, server-side only
#   ADMIN_API_KEY               - shared secret for /admin/* routes
#
# Optional:
#   TRUSTPILOT_POLICY           - 'auto' (default) or 'manual'; see README
#   REVIEW_NOTIFICATION_WEBHOOK - overrides the default n8n webhook
