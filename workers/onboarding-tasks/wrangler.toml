name = "onboarding-tasks-worker"
main = "worker.js"
compatibility_date = "2026-08-21"

# Secrets are set with `wrangler secret put`, never committed:
#   SUPABASE_URL                - https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   - service role key, server-side only
#   ADMIN_API_KEY               - shared secret for /admin/* routes
#
# Optional:
#   TRUSTPILOT_POLICY           - 'auto' (default) or 'manual'; see README
#   REVIEW_NOTIFICATION_WEBHOOK - overrides the default n8n webhook
#   G2_FETCH_VERIFY             - 'false' turns off the live G2 page check
#   REQUIRE_KNOWN_REVIEW        - ignored for G2, which always needs confirming

# Re-checks pending G2 reviews against the live page four times a day. G2
# moderates before publishing, so the check at submit time is usually too
# early; this is what drains the queue without anyone opening an email.
[triggers]
crons = ["0 */6 * * *"]
