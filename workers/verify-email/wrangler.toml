name = "verifyemail"
main = "worker.js"
compatibility_date = "2026-08-22"

[vars]
# Adjust these to match the real schema, then redeploy. No code change needed.
ACCOUNTS_TABLE      = "users"
TOKEN_COLUMN        = "token"
AUTH_ID_COLUMN      = "auth_id"
CREDITS_COLUMN      = "credits"
VERIFIED_COLUMN     = "email_verified"
VERIFY_CAP          = "10"    # credits an unverified email/password signup gets
VERIFY_HELD_CREDITS = "90"    # released on confirmation, so 10 + 90 = the usual 100

# Secrets, set with `wrangler secret put`, never committed:
#   SUPABASE_URL          - https://snxhsboboatjywgwdeds.supabase.co
#   SUPABASE_SERVICE_KEY  - service_role key (NOT the publishable key: this worker
#                           reads auth.users and writes credits)
