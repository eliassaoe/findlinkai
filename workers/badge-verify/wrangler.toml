name = "badge-verify"
main = "worker.js"
compatibility_date = "2026-08-22"

# Same namespace the other workers use, with a badge: key prefix. The signup
# worker uses ip_*, the discount worker disc:*, this one badge:* - no collisions.
[[kv_namespaces]]
binding = "BADGES"
id = "7a3cab8946f7487babd34458524bb4fa"

# No secrets. This worker reads a public page and writes two KV keys; it never
# touches Supabase or Dodo, which keeps the blast radius of an SSRF bug small.
