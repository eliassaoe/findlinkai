<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relance</title>
<!-- Gabarit de /relance. Généré par workers/explee-autogtm/relance_page.py : ne pas
     éditer relance.html à la racine, il est réécrit à chaque synchro. Les données sont
     chiffrées seulement si le secret RELANCE_PASSWORD existe (sinon en clair). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--ink:#111;--ink2:#555;--ink3:#9a9a9a;--line:#ededed;--soft:#f6f6f5;
  --accent:#111;--accent-ink:#fff;--red:#c2410c;--green:#15803d;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f10;--ink:#ededed;--ink2:#a6a6a6;--ink3:#6b6b6b;--line:#222224;--soft:#18181a;
  --accent:#ededed;--accent-ink:#0f0f10;--red:#fb923c;--green:#4ade80;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:48px 24px 96px}
.head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.head h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--ink3);margin-left:auto;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--ink3);text-decoration:none;font-size:13px}
.link:hover{color:var(--ink)}
.link.on{color:var(--ink)}
.dotok{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--green);margin-right:6px;vertical-align:1px}
.bar{display:flex;align-items:center;gap:16px;margin:28px 0 8px;flex-wrap:wrap}
.summary{color:var(--ink2);font-size:14px}
.summary b{color:var(--ink);font-weight:600}
.bar .grow{flex:1}
select.scope{appearance:none;border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;padding:0 16px 0 0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:right 4px top 55%,right 0 top 55%;background-size:4px 4px;background-repeat:no-repeat;max-width:260px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:8px 0 0}
.tab{border:0;background:none;padding:10px 0;color:var(--ink3);border-bottom:1.5px solid transparent;margin-bottom:-1px;font-size:14px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab .n{margin-left:6px;font-variant-numeric:tabular-nums}
input.q{border:0;border-bottom:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:13px;padding:2px 0;width:140px;margin-left:auto}
input.q:focus{outline:none;border-color:var(--line)}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:28px 0 4px}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.row .who{flex:1;min-width:0}
.nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.nx .late{color:var(--red)}
.row.dim{opacity:.45}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent}
.btn.sm{padding:4px 10px}
.btn:disabled{opacity:.5;cursor:default}
.tag{font-size:12px;color:var(--ink3);white-space:nowrap}
.tag.ok{color:var(--green)}
.empty{color:var(--ink3);padding:48px 0;text-align:center}
.demo,.warn{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:var(--r);padding:10px 14px;margin:20px 0 0}
.warn{color:var(--red)}
/* appels */
.call{padding:20px 0;border-bottom:1px solid var(--line)}
.call .top{display:flex;align-items:center;gap:16px}
.said{font-size:13px;color:var(--ink3);margin:8px 0 12px}
.script{background:var(--soft);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;font-size:13px;margin:0 0 8px;position:relative;padding-right:72px}
.script .copy{position:absolute;top:8px;right:8px}
.script b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:4px}
.outs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* fiche */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .15s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:10}
.drawer.on{transform:none}
.dh{padding:28px 28px 8px;display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:18px;font-weight:600}
.dh .x{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:18px;line-height:1}
.db{overflow:auto;flex:1;padding:8px 28px 40px}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.links a{font-size:13px;color:var(--ink3);text-decoration:none}.links a:hover{color:var(--ink)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:16px 0 20px}
.steps span{padding:3px 9px;border-radius:999px;background:var(--soft)}
.steps .done{color:var(--green)}
.steps .cur{background:var(--accent);color:var(--accent-ink)}
.steps .late{background:var(--red);color:#fff}
.seg{display:flex;gap:16px;margin-bottom:10px}
.seg button{border:0;background:none;padding:0;color:var(--ink3);font-size:13px}
.seg button.on{color:var(--ink)}
textarea{width:100%;min-height:240px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;line-height:1.55;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--ink3)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date]{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
details{margin-top:24px}
summary{font-size:13px;color:var(--ink3);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.msg{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;white-space:pre-wrap;word-wrap:break-word;color:var(--ink2)}
.msg.lead{color:var(--ink)}
.msg .mh{font-size:11px;color:var(--ink3);margin-bottom:4px}
/* verrou, réglages */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lockcard{width:min(380px,100%);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:28px}
.lockcard h1{font-size:17px;margin:0 0 6px;font-weight:600}
.lockcard p{color:var(--ink3);margin:0 0 16px;font-size:13px}
.lockcard ol{color:var(--ink2)}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px}
.lockcard .btn.primary{justify-content:center}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.18);z-index:30;padding:16px}
.modal.on{display:grid}
.modal .lockcard{width:min(460px,100%)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.18s;z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}
@media (max-width:640px){.wrap{padding:28px 16px 80px}.nx{display:none}.meta{margin-left:0;width:100%}input.q{display:none}}
</style>

<body>
<div id="root"></div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div class="modal" id="settings"></div>

<script>
const PAGE = /*__RELANCE_BLOB__*/null;
const REPO_ACTIONS = 'https://github.com/eliassaoe/findlinkai/actions/workflows/explee-relance.yml';
const API = 'https://api.explee.com/public/api/v1';
const LS = {pw:'relance.pw', key:'relance.explee_key', gh:'relance.gh_token', done:'relance.done', cors:'relance.cors'};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch{} },
};
const S = {data:null, pw:null, scope:{type:'all'}, tab:'today', q:'', open:null, tpl:null, done:{}};
const BUCKET = {
  reply:{l:'À répondre',c:'var(--violet)'}, call:{l:'À appeler',c:'var(--blue)'}, today:{l:'À relancer',c:'var(--accent)'},
  scheduled:{l:'Planifié',c:'var(--ink3)'}, booked:{l:'RDV calé',c:'var(--green)'}, finished:{l:'Séquence finie',c:'var(--amber)'},
  lost:{l:'Pas intéressé',c:'var(--ink3)'}, unknown:{l:'Inconnu',c:'var(--ink3)'}
};
const SHORT = {email1:'E1',call:'☎',email2:'E2',email3:'E3'};
const OUT = {no_answer:'pas de réponse',voicemail:'message laissé',retry:'à rappeler',booked:'RDV calé',not_interested:'pas intéressé'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => (n||'?').split(/[\s\-@.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const hue = s => [...(s||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const avStyle = n => `background:hsl(${hue(n)} 70% 92%);color:hsl(${hue(n)} 45% 32%)`;
const todayIso = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function dd(iso){ if(!iso) return ''; const d=new Date(iso.slice(0,10)+'T12:00:00'); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; }
function diff(iso){ return Math.round((new Date(iso.slice(0,10)+'T12:00:00') - new Date(todayIso()+'T12:00:00'))/864e5); }
function when(iso){ if(!iso) return {t:'',c:''}; const n=diff(iso);
  if(n<0) return {t:`en retard de ${-n} j`,c:'late'}; if(n===0) return {t:"aujourd'hui",c:'today'}; if(n===1) return {t:'demain',c:''}; return {t:dd(iso),c:''}; }
function dtFr(iso){ if(!iso) return ''; const d=new Date(iso); return `${d.getDate()} ${MOIS[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function ago(iso){ const m=Math.round((Date.now()-new Date(iso))/6e4); if(m<60) return `il y a ${m} min`; const h=Math.round(m/60); if(h<48) return `il y a ${h} h`; return `il y a ${Math.round(h/24)} j`; }
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `[${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}]`; }
function toast(t, err){ const e=$('#toast'); e.textContent=t; e.className='toast on'+(err?' err':''); clearTimeout(e._t); e._t=setTimeout(()=>e.className='toast'+(err?' err':''),3600); }

/* ───────── déchiffrement ───────── */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decrypt(blob, pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.salt), iterations:blob.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(msg){
  const st = PAGE && PAGE.status || {};
  if(!PAGE || !PAGE.blob){
    $('#root').innerHTML = `<div class="lock"><div class="lockcard"><h1>Relance</h1><p>Pas encore de données.</p><div class="warn">${esc(st.message||'La page n\'a pas encore été générée.')}</div><a class="btn primary" href="${REPO_ACTIONS}" target="_blank" rel="noopener">Lancer une synchro ↗</a></div></div>`;
    return;
  }
  $('#root').innerHTML = `<div class="lock"><form class="lockcard" id="lf"><h1>Relance</h1><p>Page privée. Entrez le mot de passe.</p>
    <input class="field" type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" autofocus>
    <label class="check" style="margin-bottom:14px"><input type="checkbox" id="rem" checked> Se souvenir sur cet appareil</label>
    <button class="btn primary" id="go">Ouvrir</button><div class="err" id="perr">${esc(msg||'')}</div></form></div>`;
  $('#lf').onsubmit = async e => { e.preventDefault(); const pw=$('#pw').value; $('#go').disabled=true; $('#go').textContent='…';
    const rem=$('#rem').checked; try{ await open_(pw); if(rem) store.set(LS.pw,pw); }
    catch{ $('#perr').textContent='Mot de passe incorrect.'; $('#go').disabled=false; $('#go').textContent='Ouvrir'; } };
}
async function open_(pw){
  S.data = PAGE.blob.plain ? PAGE.blob.plain : await decrypt(PAGE.blob, pw); S.pw = PAGE.blob.plain ? null : pw;
  try{ S.done = JSON.parse(store.get(LS.done)||'{}'); }catch{ S.done={}; }
  // une action faite ici avant la dernière synchro est déjà dans les données
  for(const k of Object.keys(S.done)) if(!S.done[k].at || new Date(S.done[k].at) < new Date(S.data.generated_at)) delete S.done[k];
  store.set(LS.done, JSON.stringify(S.done));
  shell(); render();
}

/* ───────── Explee depuis le navigateur (facultatif) ───────── */
const ekey = () => store.get(LS.key);
async function api(method, path, body){
  const k = ekey(); if(!k) throw Object.assign(new Error('nokey'),{nokey:true});
  let r;
  try{ r = await fetch(API+path,{method,headers:{'X-API-Key':k,'Accept':'application/json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined}); }
  catch(e){ store.set(LS.cors,'blocked'); throw Object.assign(new Error('Explee ne répond pas au navigateur (CORS)'),{cors:true}); }
  store.set(LS.cors,'ok');
  const txt = await r.text(); let j={}; try{ j=JSON.parse(txt); }catch{}
  if(!r.ok){ const m = r.status===402?'Solde Explee négatif : Explee bloque les appels.':r.status===429?'Explee limite les réponses à ce contact pour l\'instant.':r.status===403?'Explee bloque l\'envoi à ce contact.':r.status===401?'Clé Explee refusée.':`Explee ${r.status} : ${txt.slice(0,160)}`;
    throw Object.assign(new Error(m),{status:r.status,body:txt}); }
  return j;
}
async function apiReply(l, text){
  const path = `/autogtm/campaigns/${l.campaign_id}/inbox/${encodeURIComponent(l.person_id)}/reply`;
  for(const f of ['body_text','message','text','body']){
    try{ return await api('POST', path, {[f]:text}); }
    catch(e){ if(e.status===422 && /missing|required|extra|not permitted|unknown field/i.test(e.body||'')) continue; throw e; }
  }
}
async function apiAppendNote(l, line){
  const path = `/autogtm/campaigns/${l.campaign_id}/inbox/${encodeURIComponent(l.person_id)}/note`;
  const cur = await api('GET', path); const old = (cur && cur.note) || '';
  await api('POST', path, {note: old ? old+'\n'+line : line});
}
function canApi(){ return !!ekey() && store.get(LS.cors)!=='blocked'; }

/* ───────── envoi en un clic : GitHub Actions ─────────
   La page déclenche explee-relance-act.yml avec les actions chiffrées par le mot de
   passe de la page. L'Action, qui détient la clé Explee, envoie et réécrit la note. */
const GH_REPO = 'eliassaoe/findlinkai', GH_WF = 'explee-relance-act.yml';
const ghToken = () => store.get(LS.gh);
const mode = () => ghToken() ? 'github' : (canApi() ? 'explee' : 'copy');
async function encryptFor(obj){
  if(!S.pw) return JSON.stringify(obj);           // page sans mot de passe : envoi en clair
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=310000;
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(S.pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  const b=u=>btoa(String.fromCharCode(...u));
  return JSON.stringify({v:1, kdf:'PBKDF2-SHA256', iter, salt:b(salt), iv:b(iv), ct:b(ct)});
}
async function gh(method, path, body){
  const r = await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status===401?'Jeton GitHub refusé (expiré ?)':r.status===403||r.status===404?'Le jeton GitHub n\'a pas le droit Actions : écriture sur findlinkai':`GitHub ${r.status} : ${t.slice(0,140)}`); }
  return r.status===204 ? {} : r.json();
}
const Q = {items:[], timer:null};
const UNDO_MS = 6000;
function enqueue(l, action, label){
  Q.items = Q.items.filter(b=>!(b.l.key===l.key && b.action.type===action.type));
  Q.items.push({l, action, label});
  S.done[l.key] = {at:new Date().toISOString(), text:label, pending:true, queued:true};
  store.set(LS.done, JSON.stringify(S.done)); render(); if(S.open) openLead(S.open,true);
  clearTimeout(Q.timer); Q.timer = setTimeout(flush, UNDO_MS);   // délai pour annuler, et regroupe les clics
}
function unqueue(key){
  Q.items = Q.items.filter(b=>b.l.key!==key); delete S.done[key];
  store.set(LS.done, JSON.stringify(S.done)); render(); if(S.open) openLead(S.open,true); toast('Annulé');
}
async function flush(){
  const batch = Q.items.splice(0); if(!batch.length) return;
  if(mode()!=='github') return flushDirect(batch);
  const t0 = Date.now();
  for(const b of batch) S.done[b.l.key] = {at:new Date().toISOString(), text:b.label+' · envoi…', pending:true};
  render();
  try{
    const payload = await encryptFor({v:1, actions: batch.map(b=>({key:b.l.key, ...b.action}))});
    await gh('POST', `/repos/${GH_REPO}/actions/workflows/${GH_WF}/dispatches`, {ref:'main', inputs:{payload}});
    for(const b of batch) S.done[b.l.key] = {at:new Date().toISOString(), text:b.label+' · en cours', pending:true};
    store.set(LS.done, JSON.stringify(S.done)); render();
    toast(`${batch.length} action(s) lancée(s) · résultat dans ~1 min`);
    watch(t0, batch);
  }catch(e){
    for(const b of batch) delete S.done[b.l.key];
    store.set(LS.done, JSON.stringify(S.done)); render();
    toast(e.message, true);
  }
}
async function watch(t0, batch){
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r, 8000));
    try{
      const j = await gh('GET', `/repos/${GH_REPO}/actions/workflows/${GH_WF}/runs?event=workflow_dispatch&per_page=5`);
      const run = (j.workflow_runs||[]).find(r=>new Date(r.created_at).getTime() >= t0-15000);
      if(!run || run.status!=='completed') continue;
      const ok = run.conclusion==='success';
      for(const b of batch) S.done[b.l.key] = {at:new Date().toISOString(), text: b.label+(ok?' ✓':' · échec'), failed:!ok, run:run.html_url};
      store.set(LS.done, JSON.stringify(S.done)); render(); if(S.open) openLead(S.open,true);
      toast(ok?`${batch.length} action(s) faite(s) ✓`:'L\'envoi a échoué : voir le détail sur GitHub', !ok);
      return;
    }catch{ }
  }
}

async function flushDirect(batch){
  let ok=0;
  for(const b of batch){
    try{
      if(b.action.type==='reply'){ await apiReply(b.l, b.action.text); try{ await apiAppendNote(b.l, `${stamp()} Relance · Email envoyé : ${STEP[b.action.step]}`); }catch{} }
      else await apiAppendNote(b.l, b.action.line);
      S.done[b.l.key] = {at:new Date().toISOString(), text:b.label+' ✓'}; ok++;
    }catch(e){
      delete S.done[b.l.key];
      if(e.cors){ store.set(LS.cors,'blocked'); toast('Explee refuse les appels du navigateur : activez l\'envoi via GitHub', true); settings(); break; }
      toast(e.message, true);
    }
  }
  store.set(LS.done, JSON.stringify(S.done)); render(); if(S.open) openLead(S.open,true);
  if(ok) toast(`${ok} action(s) faite(s) ✓`);
}

/* Enregistre une action dans la note du lead : GitHub, sinon Explee direct, sinon copie + inbox. */
async function record(l, entry, opts={}){
  const line = `${stamp()} Relance · ${entry}`;
  if(mode()!=='copy'){ enqueue(l, {type:'note', line}, entry); return true; }
  await copyText(line, true);
  window.open(l.inbox_url,'_blank','noopener');
  toast('Ligne copiée : collez-la dans la note du lead (inbox Explee)');
  markDone(l, entry);
  return true;
}
function markDone(l, entry){
  S.done[l.key] = {at:new Date().toISOString(), text:entry};
  store.set(LS.done, JSON.stringify(S.done)); render(); if(S.open) openLead(S.open, true);
}

/* Email prêt à partir pour ce lead (étape du jour), ou null. */
function sendable(l){
  if(S.done[l.key] || l.auto) return null;    // l.auto : recover.py envoie déjà les relances de ce projet
  if(l.bucket==='reply') return l.review ? null : {step:'reply', text:l.drafts.reply};
  if(l.bucket==='today' && l.next && /^email\d$/.test(l.next.key)) return {step:l.next.key, text:l.drafts[l.next.key]};
  return null;
}
const STEP = {reply:'Réponse', email1:'Email 1', email2:'Email 2', email3:'Email 3'};
async function sendNow(l, step, text){
  if(mode()!=='copy'){ enqueue(l, {type:'reply', text, step, expect_after:l.expect_after}, STEP[step]+' envoyé'); return; }
  await copyText(text, true); window.open(l.inbox_url,'_blank','noopener');
  toast('Texte copié : collez-le en réponse dans le fil'); markDone(l, STEP[step]+' préparé');
}
async function sendAll(list){
  if(mode()!=='github' && mode()!=='explee'){ settings(); return toast('Activez l\'envoi en un clic d\'abord', true); }
  const names = list.map(x=>`• ${x.l.name} — ${STEP[x.s.step]}`).join('\n');
  if(!confirm(`Envoyer ${list.length} email(s) maintenant ?\n\n${names}`)) return;
  for(const x of list) await sendNow(x.l, x.s.step, x.s.text);
  toast(`${list.length} email(s) en file · annulable ${UNDO_MS/1000} s`);
}

/* ───────── rendu ───────── */
function inScope(l){
  const s=S.scope;
  if(s.type==='project' && String(l.project_id)!==String(s.id)) return false;
  if(s.type==='campaign' && String(l.campaign_id)!==String(s.id)) return false;
  if(S.q){ const q=S.q.toLowerCase(); if(![l.name,l.company,l.email,l.campaign].join(' ').toLowerCase().includes(q)) return false; }
  return true;
}
const isAction = l => ['reply','call','today'].includes(l.bucket) && !S.done[l.key];
const prio = l => ({reply:0,call:1,today:2,scheduled:3,booked:4,finished:5,lost:6,unknown:7})[l.bucket];
const byPrio = (a,b) => (!!S.done[a.key])-(!!S.done[b.key]) || prio(a)-prio(b) || ((a.next||{}).due||'9').localeCompare((b.next||{}).due||'9');
const short = c => String(c||'').replace(/^Prescient\s*[–-]\s*/,'');
function render(){ renderMain(); }

function scopeSelect(){
  const d=S.data; let o=`<option value='{"type":"all"}'>Tous les projets (${d.leads.length})</option>`;
  for(const p of d.projects){
    const pl=d.leads.filter(l=>String(l.project_id)===String(p.id)); if(!pl.length) continue;
    o += `<option value='${esc(JSON.stringify({type:'project',id:p.id}))}'>${esc(p.name)} (${pl.length})</option>`;
    for(const c of d.campaigns.filter(c=>String(c.project_id)===String(p.id))){
      const n=pl.filter(l=>String(l.campaign_id)===String(c.id)).length; if(!n) continue;
      o += `<option value='${esc(JSON.stringify({type:'campaign',id:c.id}))}'>   ${esc(short(c.name))} (${n})</option>`;
    }
  }
  return `<select class="scope" id="scope">${o}</select>`;
}

function renderMain(){
  const d=S.data, leads=d.leads.filter(inScope);
  // « Aujourd'hui » = ce qui demande VOTRE action : pas les emails que recover.py envoie déjà
  const mine = l => !(l.auto && ['reply','today'].includes(l.bucket) && !l.review);
  const emails = leads.filter(l=>['reply','today'].includes(l.bucket) && !S.done[l.key] && mine(l));
  const calls = leads.filter(l=>l.bucket==='call');
  const later = leads.filter(l=>l.bucket==='scheduled').length;
  const ready = emails.map(l=>({l, s:sendable(l)})).filter(x=>x.s);
  let h = d.demo ? `<div class="demo">Données d'exemple : rien n'est envoyé.</div>` : '';
  if((Date.now()-new Date(d.generated_at))/36e5>26) h += `<div class="warn">Dernière synchro ${esc(ago(d.generated_at))}. <a href="${REPO_ACTIONS}" target="_blank" rel="noopener">Actualiser</a></div>`;
  h += `<div class="bar"><span class="summary"><b>${emails.length}</b> email${emails.length>1?'s':''} · <b>${calls.filter(l=>!S.done[l.key]).length}</b> appel${calls.length>1?'s':''} · ${later} plus tard</span>
    <span class="grow"></span>${scopeSelect()}
    ${ready.length?`<button class="btn primary" id="sendall">${mode()==='copy'?'Activer l\'envoi':`Tout envoyer (${ready.length})`}</button>`:''}</div>`;
  const tabs=[['today','Aujourd\'hui',emails.length+calls.filter(l=>!S.done[l.key]).length],['calls','Appels',calls.length],['all','Tout',leads.length]];
  h += `<div class="tabs">${tabs.map(([id,l,c])=>`<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${l}<span class="n">${c}</span></button>`).join('')}<input class="q" id="q" placeholder="Rechercher" value="${esc(S.q)}"></div>`;
  if(S.tab==='calls') h += callList(calls, leads.filter(l=>l.bucket==='scheduled'&&l.next&&l.next.key==='call'&&l.phones.length));
  else if(S.tab==='today'){
    const act = leads.filter(l=>['reply','call','today'].includes(l.bucket) && mine(l));
    h += act.length ? groups(act,['reply','today','call']) : `<div class="empty">Rien à faire aujourd'hui.</div>`;
  } else h += leads.length ? groups(leads,['reply','today','call','scheduled','booked','finished','lost','unknown']) : `<div class="empty">Aucun lead.</div>`;
  $('#content').innerHTML = h;
  $('#scope').value = JSON.stringify(S.scope.type==='all'?{type:'all'}:S.scope);
  $('#scope').onchange=e=>{ S.scope=JSON.parse(e.target.value); renderMain(); };
  $('#q').oninput=e=>{ S.q=e.target.value.trim(); const pos=e.target.selectionStart; renderMain(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); };
  $('#content').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab; renderMain();});
  $('#content').querySelectorAll('[data-key]').forEach(r=>r.onclick=e=>{ if(e.target.closest('a,button,input')) return; openLead(r.dataset.key);});
  wireActions($('#content'));
}
const SEC = {reply:'À répondre', today:'Relances', call:'Appels', scheduled:'Plus tard', booked:'RDV calés', finished:'Séquence terminée', lost:'Pas intéressés', unknown:'Autres'};
function groups(leads, order){
  let h='';
  for(const b of order){
    const g = leads.filter(l=>l.bucket===b).sort(byPrio); if(!g.length) continue;
    h += `<div class="sec">${SEC[b]}</div>${g.map(row).join('')}`;
  }
  return h;
}
function nextText(l){
  const dn=S.done[l.key];
  if(dn) return `<span class="tag ok">${esc(dn.text)}</span>`;
  if(['booked','lost','finished','unknown'].includes(l.bucket)) return '';
  if(l.bucket==='reply') return 'attend votre réponse';
  const w=when(l.next&&l.next.due);
  return `${esc(l.next?l.next.label:'')} · <span class="${w.c==='late'?'late':''}">${w.t}</span>`;
}
function row(l){
  const sub=[l.company, short(l.campaign)].filter(Boolean).join(' · ');
  return `<div class="row ${S.done[l.key]&&!S.done[l.key].queued?'dim':''}" data-key="${esc(l.key)}">
    <div class="who"><div class="nm">${esc(l.name)}</div><div class="sub">${esc(sub)}</div></div>
    <div class="nx">${nextText(l)}</div><div>${actionCell(l)}</div></div>`;
}
function actionCell(l){
  const dn = S.done[l.key];
  if(dn && dn.queued) return `<button class="btn sm" data-undo="${esc(l.key)}">Annuler</button>`;
  if(dn) return dn.failed ? `<a class="tag" href="${esc(dn.run||REPO_ACTIONS)}" target="_blank" rel="noopener">échec ↗</a>` : '';
  const sd = sendable(l);
  if(sd) return `<button class="btn sm" data-send="${esc(l.key)}" title="${esc(sd.text.slice(0,400))}">Envoyer</button>`;
  if(l.bucket==='call' && l.phones.length) return `<a class="btn sm" href="tel:${esc(l.phones[0].raw)}" data-tel="${esc(l.key)}">Appeler</a>`;
  if(l.bucket==='reply' && l.review) return `<button class="btn sm" data-open="${esc(l.key)}">À relire</button>`;
  if(l.auto && ['today','reply'].includes(l.bucket)) return `<span class="tag" title="Ces emails partent déjà automatiquement (recover.py)">auto</span>`;
  return '';
}
function callList(calls, later){
  let h = calls.length ? callCards(calls) : `<div class="empty">Aucun appel aujourd'hui.</div>`;
  if(later && later.length) h += `<div class="sec">Prochains appels</div>${callCards(later, true)}`;
  return h;
}
function callCards(calls, later){
  return calls.sort(byPrio).map(l=>{ const d=l.drafts, p=l.phones[0], dn=S.done[l.key];
    return `<div class="call" style="${dn?'opacity:.45':''}">
      <div class="top"><div class="who" style="flex:1;min-width:0"><div class="nm">${esc(l.name)}</div><div class="sub">${esc([l.title,l.company].filter(Boolean).join(' · '))}</div></div>
      ${dn?`<span class="tag ok">${esc(dn.text)}</span>`:`${later?`<span class="tag">${esc(when(l.next.due).t)}</span>`:''}<a class="btn ${later?'':'primary'}" href="tel:${esc(p.raw)}">${esc(p.pretty)}</a>`}</div>
      <div class="said">« ${esc(l.last_reply.slice(0,200))} »</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.call)}">Copier</button><b>Script</b>${esc(d.call)}</div>
      <details><summary>Messagerie et SMS</summary>
        <div class="script" style="margin-top:8px"><button class="btn sm ghost copy" data-copytxt="${esc(d.voicemail)}">Copier</button><b>Messagerie</b>${esc(d.voicemail)}</div>
        <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.sms)}">Copier</button><b>SMS</b>${esc(d.sms)}</div></details>
      ${dn?'':`<div class="outs"><button class="btn sm" data-callout="booked" data-k="${esc(l.key)}">RDV calé</button><button class="btn sm" data-callout="voicemail" data-k="${esc(l.key)}">Message laissé</button><button class="btn sm" data-callout="no_answer" data-k="${esc(l.key)}">Pas de réponse</button><button class="btn sm" data-callout="not_interested" data-k="${esc(l.key)}">Pas intéressé</button></div>`}
    </div>`; }).join('');
}
function wireActions(root){
  const L = k => S.data.leads.find(x=>x.key===k);
  root.querySelectorAll('[data-send]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const l=L(b.dataset.send); const sd=sendable(l); if(!sd) return;
    if(mode()==='copy'){ settings(); return toast('Activez l\'envoi en un clic (une seule fois)'); } sendNow(l, sd.step, sd.text); toast(`${STEP[sd.step]} à ${l.name} · annulable ${UNDO_MS/1000} s`); });
  root.querySelectorAll('[data-undo]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); unqueue(b.dataset.undo); });
  root.querySelectorAll('[data-tel]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); });
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openLead(b.dataset.open); });
  root.querySelectorAll('[data-copytxt]').forEach(b=>b.onclick=()=>copyText(b.dataset.copytxt));
  root.querySelectorAll('[data-callout]').forEach(b=>b.onclick=()=>record(L(b.dataset.k), `Appel : ${OUT[b.dataset.callout]}`));
  const sa=root.querySelector('#sendall'); if(sa) sa.onclick=()=>{ if(mode()==='copy') return settings();
    const leads=S.data.leads.filter(inScope).filter(l=>['reply','today'].includes(l.bucket)); sendAll(leads.map(l=>({l, s:sendable(l)})).filter(x=>x.s)); };
}

/* ───────── fiche lead ───────── */
function openLead(key, keepTpl){
  const l = S.data.leads.find(x=>x.key===key); if(!l) return closeLead();
  S.open = key;
  const defTpl = l.bucket==='reply' ? 'reply' : (l.next && l.next.key) || 'email1';
  if(!keepTpl || !S.tpl) S.tpl = defTpl;
  const dn = S.done[l.key];
  const links = [`<a href="${esc(l.inbox_url)}" target="_blank" rel="noopener">Inbox ↗</a>`,
    l.linkedin?`<a href="${esc(l.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:'',
    `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`,
    ...l.phones.map(p=>`<a href="tel:${esc(p.raw)}">${esc(p.pretty)}</a>`)].filter(Boolean).join('');
  let h = `<div class="dh"><div style="min-width:0"><h2>${esc(l.name)}</h2><div class="sub">${esc([l.title,l.company,short(l.campaign)].filter(Boolean).join(' · '))}</div><div class="links">${links}</div></div><button class="x" id="close" aria-label="Fermer">✕</button></div><div class="db">`;
  if(l.steps.length) h += `<div class="steps">${l.steps.map(s=>{
    const cur = l.next && l.next.key===s.key && !['booked','lost'].includes(l.bucket);
    const cls = s.done?'done':(cur?(s.due&&diff(s.due)<0?'late':'cur'):'');
    const lab = s.key==='call'?'Appel':s.label;
    return `<span class="${cls}" title="${esc(s.done?'fait':('prévu '+dd(s.due)))}">${s.done?'✓ ':''}${lab}${!s.done&&s.due?' · '+esc(cur?when(s.due).t:dd(s.due)):''}</span>`;
  }).join('')}</div>`;
  if(dn) h += `<div class="tag ok" style="margin-bottom:12px">${esc(dn.text)}</div>`;
  const tpls = [['reply','Réponse'],['email1','Email 1'],['email2','Email 2'],['email3','Email 3']];
  if(l.phones.length) tpls.splice(2,0,['call','Appel']);
  h += `<div class="seg">${tpls.map(([k,t])=>`<button data-tpl="${k}" class="${S.tpl===k?'on':''}">${t}</button>`).join('')}</div>`;
  if(S.tpl==='call'){
    const d=l.drafts;
    h += `<div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.call)}">Copier</button><b>Script</b>${esc(d.call)}</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.voicemail)}">Copier</button><b>Messagerie</b>${esc(d.voicemail)}</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.sms)}">Copier</button><b>SMS</b>${esc(d.sms)}</div>
      <div class="actions"><a class="btn primary" href="tel:${esc(l.phones[0].raw)}">Appeler ${esc(l.phones[0].pretty)}</a></div>
      <div class="outs"><button class="btn sm" data-out="booked">RDV calé</button><button class="btn sm" data-out="voicemail">Message laissé</button><button class="btn sm" data-out="no_answer">Pas de réponse</button><button class="btn sm" data-out="not_interested">Pas intéressé</button></div>
      <div class="inline note">Rappeler le <input type="date" id="retryAt"> <button class="btn sm" data-out="retry">OK</button></div>`;
  } else {
    const direct = mode()!=='copy' && !l.auto;
    h += `${l.auto?'<div class="note" style="margin-bottom:8px">Ce projet est relancé automatiquement par recover.py.</div>':''}${l.review && S.tpl==='reply'?'<div class="warn" style="margin:0 0 10px">Le lead pose une question : complétez la réponse.</div>':''}<textarea id="draft">${esc(l.drafts[S.tpl]||'')}</textarea>
      <div class="actions">${dn&&dn.queued?`<button class="btn" data-undo="${esc(l.key)}">Annuler l'envoi</button>`:(direct?`<button class="btn primary" id="send">Envoyer</button>`:`<button class="btn primary" id="copyopen">Copier et ouvrir l'inbox</button>`)}<button class="btn ghost" data-copytxt-draft="1">Copier</button></div>`;
  }
  const status = l.bucket==='booked'||l.bucket==='lost'
    ? `<button class="link" data-status="reactivate">Réactiver la séquence</button>`
    : `<button class="link" data-status="booked">RDV calé</button><button class="link" data-status="lost">Pas intéressé</button>`;
  h += `<div class="inline note" style="margin-top:20px;gap:16px">${status}<span>Attendre jusqu'au <input type="date" id="snooze" value="${esc(l.wait_until||'')}"></span></div>`;
  h += `<details><summary>Conversation (${l.thread.length})</summary>${l.thread.map(m=>`<div class="msg ${m.from}"><div class="mh">${m.from==='lead'?esc(l.first_name||l.name):'Vous'} · ${dtFr(m.at)}</div>${esc(m.text||'')}</div>`).join('')}${l.note?`<div class="msg"><div class="mh">Note Explee</div>${esc(l.note)}</div>`:''}</details></div>`;

  const dr=$('#drawer'); dr.innerHTML=h; dr.classList.add('on'); $('#veil').classList.add('on');
  $('#close').onclick=closeLead;
  dr.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{S.tpl=b.dataset.tpl; openLead(key,true);});
  dr.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>callOutcome(l,b.dataset.out));
  dr.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>({booked:()=>record(l,'RDV calé'),lost:()=>record(l,'Pas intéressé'),reactivate:()=>record(l,'Séquence réactivée')})[b.dataset.status]());
  const sz=$('#snooze'); if(sz) sz.onchange=()=>{ if(sz.value) record(l,`Attendre jusqu'au ${sz.value}`); };
  const cd=dr.querySelector('[data-copytxt-draft]'); if(cd) cd.onclick=()=>copyText($('#draft').value);
  const send=$('#send'); if(send) send.onclick=()=>{ const t=$('#draft').value.trim(); if(!t) return toast('Message vide',true); sendNow(l, S.tpl, t); toast(`${STEP[S.tpl]} à ${l.name} · annulable ${UNDO_MS/1000} s`); };
  const co=$('#copyopen'); if(co) co.onclick=async()=>{ await copyText($('#draft').value,true); window.open(l.inbox_url,'_blank','noopener'); toast('Texte copié : collez-le en réponse dans le fil'); markDone(l, `${STEP[S.tpl]} préparé`); };
  wireActions(dr);
}
function closeLead(){ S.open=null; S.tpl=null; $('#drawer').classList.remove('on'); $('#veil').classList.remove('on'); }
$('#veil').onclick=closeLead;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeLead(); $('#settings').classList.remove('on'); } if(e.key==='/' && !['TEXTAREA','INPUT'].includes(document.activeElement.tagName) && $('#q')){ e.preventDefault(); $('#q').focus(); }});

async function copyText(t, quiet){ try{ await navigator.clipboard.writeText(t); if(!quiet) toast('Copié'); }catch{ if(!quiet) toast('Copie impossible',true); } }
function callOutcome(l, o){
  if(o==='retry'){ const v=$('#retryAt').value; if(!v) return toast('Choisissez une date de rappel',true); return record(l,`Appel : à rappeler le ${v}`); }
  return record(l, `Appel : ${OUT[o]}`);
}
function exportCsv(){
  const lab = Object.fromEntries(Object.entries(BUCKET).map(([k,v])=>[k,v.l]));
  const head = ['Statut','Prochaine action','Échéance','Nom','Téléphone','Email','Poste','Entreprise','Site','LinkedIn','Projet','Campagne','Hot depuis','Relances envoyées','Dernier msg de','Jours de silence',"Attendre jusqu'au",'Dernière réponse du lead','Inbox'];
  const q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = S.data.leads.filter(inScope).sort(byPrio).map(l=>[lab[l.bucket],(l.next||{}).label,(l.next||{}).due,l.name,l.phones.map(p=>p.pretty).join(' | '),l.email,l.title,l.company,l.domain,l.linkedin,l.project,l.campaign,l.hot_since,l.relances_sent,{lead:'Lead',me:'Moi'}[l.last_from]||'',l.days_silent,l.wait_until,l.last_reply,l.inbox_url]);
  const csv = '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`hot_leads_${todayIso()}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ───────── démarrage ───────── */
(async()=>{
  const pw = store.get(LS.pw);
  if(PAGE && PAGE.blob && PAGE.blob.plain){ await open_(null); return; }
  if(PAGE && PAGE.blob && pw){ try{ await open_(pw); return; }catch{ store.set(LS.pw,null); } }
  lockScreen();
})();
</script>
