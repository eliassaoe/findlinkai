name = "campaign-signup"
main = "worker.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
binding = "ASSETS"
# /100free serves public/100free.html, /confirmation-signup likewise.
html_handling = "auto-trailing-slash"
# Unknown paths fall through to worker.js, which redirects to linkfinderai.com.
not_found_handling = "none"

# The throwaway domain. The zone has to be on Cloudflare DNS; on deploy wrangler
# creates the DNS record and the certificate itself. Uncomment and set it, then
# `wrangler deploy`. Until then the Worker is only reachable on its workers.dev
# URL, which is fine for testing but must not go in an email.
# routes = [
#   { pattern = "go.your-throwaway-domain.com", custom_domain = true }
# ]
