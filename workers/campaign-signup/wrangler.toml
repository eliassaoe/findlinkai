name = "campaign-signup"
main = "worker.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
binding = "ASSETS"
# /100free serves public/100free.html, /confirmation-signup likewise.
html_handling = "auto-trailing-slash"
# Unknown paths fall through to worker.js, which redirects to linkfinderai.com.
not_found_handling = "none"

# The throwaway domain: linkfinderai-team.com (Namecheap, not an Instantly
# sending domain, nothing else depends on it). Its nameservers must point at
# Cloudflare for this to deploy; wrangler then creates the DNS record and the
# certificate itself. If deploy says a record already exists at the apex,
# delete that record in Cloudflare DNS and deploy again.
routes = [
  { pattern = "linkfinderai-team.com", custom_domain = true }
]
