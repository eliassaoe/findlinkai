name = "linkfinder-ai-support"
main = "worker.js"
compatibility_date = "2026-08-01"

# Secrets (set via `wrangler secret put <NAME>`, never in this file):
#   ANTHROPIC_API_KEY   required — from console.anthropic.com
#   RESEND_API_KEY       optional — enables automatic email on escalation
#   SUPPORT_TO_EMAIL     optional — default support@linkfinderai.com
#   SUPPORT_FROM_EMAIL   optional — default support-bot@linkfinderai.com
