name = "linkfinder-ai-support"
main = "worker.js"
compatibility_date = "2026-08-01"

# Secrets (set via `wrangler secret put <NAME>`, never in this file):
#   OPENROUTER_API_KEY     required — from openrouter.ai/keys
#   OPENROUTER_MODEL       optional — defaults to anthropic/claude-haiku-4.5,
#                          any model slug from openrouter.ai/models works
#   SUPPORT_TO_EMAIL       optional — default support@linkfinderai.com
#   POSTHOG_PROJECT_API_KEY  optional — only needed if you rotate the
#                          existing public project token
