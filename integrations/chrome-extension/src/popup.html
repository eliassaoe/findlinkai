<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkFinder AI</title>
<style>
:root { color-scheme: light dark; }
body { width: 260px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1f2937; background: #fff; }
h1 { margin: 0 0 2px; font-size: 14px; color: #1e3a8a; }
p { margin: 0 0 10px; color: #6b7280; font-size: 12px; }
.state { padding: 9px 10px; border-radius: 8px; background: #eff6ff; color: #1e3a8a; font-size: 12px; }
.state[data-tone="warn"] { background: #fffbeb; color: #92400e; }
.cta { display: block; margin-top: 10px; padding: 8px; text-align: center; text-decoration: none; font-size: 13px; font-weight: 600; color: #1e3a8a; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; }
button { margin-top: 10px; width: 100%; padding: 8px; font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
.ver { margin: 10px 0 0; font-size: 11px; color: #9ca3af; }
@media (prefers-color-scheme: dark) {
  body { color: #e5e7eb; background: #1b1f23; }
  h1 { color: #93c5fd; }
  .state { background: #17263f; color: #bfdbfe; }
  .state[data-tone="warn"] { background: #3a2c10; color: #fcd34d; }
}
</style>
</head>
<body>
<h1>LinkFinder AI</h1>
<p>Lookups happen in the panel on the LinkedIn page itself.</p>
<div id="state" class="state">Checking…</div>
<a id="app" class="cta" href="#" target="_blank" rel="noopener">Open LinkFinder →</a>
<button id="options" type="button">Settings</button>
<p class="ver" id="ver"></p>
<script type="module" src="popup.js"></script>
</body>
</html>
