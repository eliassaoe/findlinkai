<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 24px 80px}

header{display:flex;align-items:baseline;gap:12px;padding:28px 0 20px}

/* One row of plain-text switches. No tab chrome. */
nav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:28px}
nav button{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;
  padding:0 0 10px;margin-bottom:-1px;border-bottom:1.5px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav .sp{flex:1}
nav a{color:var(--muted);text-decoration:none;font-size:13px;padding-bottom:10px;cursor:pointer}

h2{font-size:14px;font-weight:600;margin:34px 0 2px;letter-spacing:-.01em}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}

  padding:7px 14px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--accent);color:var(--accent)}
button.b.go{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.go:hover{color:#fff;opacity:.9}
button.b.risk{border-color:var(--danger);color:var(--danger)}
button.b.risk:hover{background:var(--danger);color:#fff}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent);
  border-radius:5px;padding:3px 9px;font-size:13px;margin:0 6px 6px 0}

.note{color:var(--muted);font-size:13px;margin:12px 0;padding-left:12px;border-left:2px solid var(--line)}

<script>
/* GTM Console — one campaign, three screens.
 *
 * Everything is in localStorage. No database, no login, no library. The agent
 * runs on GitHub Actions, so the two handoffs are: Download JSON (the config,
 * in the exact shape run.py load_config reads) and the Run screen (dispatches
 * the workflow through the GitHub API, which sends CORS headers).
 *
 * Deliberately one campaign at a time. Multi-client lives in the JSON files —
 * one per campaign, committed — which is simpler than a sidebar tree for one
 * operator, and is what the runner reads anyway.
 */
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : String(k));
  return n;
};
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const STAGES = [['first_email', 'First email'], ['follow_up', 'Follow-ups'], ['reply', 'Replies']];
const MAX_INSTR = 3000;            // matches models.py and the schema CHECK
const DEFAULT_REPO = 'eliassaoe/findlinkai';

let view = store.get('view', 'campaign');
let stage = 'first_email';

function say(m, err) {
  const n = $('#status');
  n.textContent = m || ''; n.className = err ? 'err' : '';
  if (m && !err) setTimeout(() => { if (n.textContent === m) n.textContent = ''; }, 3000);
}

/* ---------------------------------------------------------------- the data
 * One object. Prompts are a list because they are versioned: saving appends,
 * never overwrites, so a change in reply rate is attributable to a change in
 * the prompt.
 */
const BLANK = {
  project: { name: '', domain: '', facts: '', booking_link: '', cc_email: '', sender_name: '',
             sending_emails: [], daily_cap: 135 },
  campaign: { name: '', kind: 'b2b', offer: '', customer_problem: '', example_clients: [],
              keywords: [], target_role: '', target_geography: '', company_domains: '',
              title_keywords: '', title_exclude: '', min_company_size: 0, signal_agents: '',
              max_leads: 1000, send_mode: 'dry', require_signal: true,
              positive_criteria: [], negative_criteria: [], instantly_campaign_id: null },
  prompts: { first_email: [], follow_up: [], reply: [] },
};

const SEED = {
  project: {
    name: 'linkfinderai.com', domain: 'linkfinderai.com',
    facts: 'LinkFinder AI turns a name, company, email or LinkedIn URL into a verified business email or phone number. Plans start at $49/month for 5,000 credits. A LinkedIn-profile-to-email lookup costs 10 credits.\n\nThe outbound service: we build the list, write the campaign, run the sending and handle replies. You pay per meeting held.',
    booking_link: 'https://calendly.com/hamoureliasse/offre-linkfinder-ai-outbound/',
    cc_email: 'support@linkfinderai.com', sending_emails: [], daily_cap: 135, sender_name: 'Elias',
  },
  campaign: {
    name: 'organismes de formation FR/BE/LU', kind: 'b2b',
    offer: 'Outbound run end to end, paid per meeting held.',
    customer_problem: 'Prospecting stops whenever the team is delivering training, so the pipeline arrives in waves.',
    example_clients: ['Cegos', 'Demos', 'Orsys'],
    keywords: ['organisme de formation', 'centre de formation'],
    target_role: 'Dirigeant, responsable commercial',
    target_geography: 'France, Belgique, Luxembourg',
    positive_criteria: ['Vente B2B active', 'Equipe commerciale de moins de 5'],
    negative_criteria: ['Formation purement subventionnee', 'Plus de 200 salaries'],
    signal_agents: 'active_hiring, recent_news',
    max_leads: 1000, send_mode: 'dry', require_signal: true,
    instantly_campaign_id: null,
  },
  prompts: {
    first_email: [{ version: 1, instructions: 'Ask for a reply, not a call. Never mention a discount. Name the pay-per-meeting model once — it is the whole reason this offer is different — and do not explain it twice.', language: 'lead', at: Date.now() }],
    follow_up: [{ version: 1, instructions: 'New angle each time. Follow-up 1: the cost of waiting a quarter. Follow-up 2: offer a sample list of 20 prospects, free, no call needed.', language: 'lead', follow_up_every_days: 3, max_follow_ups: 2, at: Date.now() }],
    reply: [{ version: 1, instructions: 'Only facts from the project notes. No pressure. Send the booking link only once they have shown real interest.', language: 'lead', at: Date.now() }],
  },
};

let D = store.get('gtm', null);
if (!D) { D = SEED; store.set('gtm', D); }
for (const k of Object.keys(BLANK)) D[k] = { ...BLANK[k], ...(D[k] || {}) };

const save = () => store.set('gtm', D);
const head = s => (D.prompts[s] || []).slice(-1)[0] || { version: 0, instructions: '', language: 'lead' };

/* ------------------------------------------------------------------ fields */
function text(obj, key, label, hint, { area = false, mono = false, rows = 3 } = {}) {
  const i = el(area ? 'textarea' : 'input', area ? { rows, class: mono ? 'mono' : '' } : { type: 'text' });
  i.value = obj[key] ?? '';
  i.addEventListener('change', () => { obj[key] = i.value; save(); say('saved'); });
  return el('div', {}, el('label', {}, label, hint ? el('span', { style: 'font-weight:400' }, ' · ' + hint) : null), i);
}

function chips(obj, key, label, hint) {
  const box = el('div', { class: 'chips' });
  const draw = () => box.replaceChildren(
    ...(obj[key] || []).map((v, i) => el('span', { class: 'chip' }, v,
      el('button', { title: 'remove', onclick: () => { obj[key].splice(i, 1); save(); draw(); } }, '×'))),
    el('input', {
      type: 'text', placeholder: '+ add',
      onkeydown: e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const v = e.target.value.trim();
        if (!v) return;
        (obj[key] ||= []).push(v); save(); e.target.value = ''; draw();
      },
    }),
  );
  draw();
  return el('div', {}, el('label', {}, label, hint ? el('span', { style: 'font-weight:400' }, ' · ' + hint) : null), box);
}

/* -------------------------------------------------------------- 1. campaign
 * Offer, audience and the facts, on one screen. They are one decision — what
 * you sell and who to — and splitting them across three tabs made it feel
 * bigger than it is.
 */
function viewCampaign() {
  const p = D.project, c = D.campaign;
  return [
    el('h2', {}, 'Offer'),
    el('p', { class: 'hint' }, 'What this campaign sells, and to whom.'),
    text(c, 'name', 'Campaign name'),
    text(c, 'offer', 'What you offer', null, { area: true }),
    text(c, 'customer_problem', 'The problem they have', null, { area: true }),
    chips(c, 'example_clients', 'Example clients'),

    el('h2', {}, 'Audience'),
    el('p', { class: 'hint' }, 'The qualifier re-checks every lead against these — judgement, not just search filters.'),
    text(c, 'target_role', 'Target role', 'comma separated'),
    text(c, 'target_geography', 'Geography'),
    chips(c, 'keywords', 'Company keywords', 'what kind of company — bounds the search'),
    text(c, 'title_keywords', 'Title must contain one of',
         'comma separated, matched against the real job title — the single best ' +
         'filter there is. "responsable commercial" as a search finds every Sales ' +
         'Manager; this is what keeps the ones you meant. Leave empty to keep all.'),
    text(c, 'title_exclude', 'Title must NOT contain',
         'comma separated — the off-segments you already know about'),
    text(c, 'signal_agents', 'Buying-trigger agents',
         'comma separated Explee agent ids — active_hiring, recent_news, funding, ' +
         'is_active. 1 credit per agent per company, only on companies that pass ' +
         'the filters above. This is the reply-rate lever: a real trigger moves ' +
         'cold email from 1-3% to 5-18%. Empty to skip.'),
    (() => {
      const box = el('input', { type: 'checkbox' });
      box.checked = c.require_signal !== false;
      box.addEventListener('change', () => { c.require_signal = box.checked; save(); say('saved'); });
      return el('div', {}, el('label', {}, 'Only email people with a live trigger'),
        el('div', { class: 'row' }, box, el('span', { class: 'hint', style: 'margin:0' },
          'Drops leads whose company returned nothing from the agents above, before the address lookup ' +
          'and the writer. Roughly doubles the reply rate and spends the two expensive steps only where ' +
          'they can pay. Untick to email everyone who qualifies.')));
    })(),
    text(c, 'min_company_size', 'Minimum company size',
         'headcount floor, 0 for none — drops the one-person shells'),
    text(c, 'max_company_size', 'Maximum company size',
         'headcount ceiling, read from "plus de N salariés" in Should NOT be if empty'),
    text(c, 'max_sales_team', 'Maximum sales team',
         'from employees_count_sales in the search — read from "moins de N" in Should be if empty'),
    text(c, 'page_size', 'People to fetch',
         'per run, before the filters. The first 100 are free; after that 1 credit each plus 0.1 per ' +
         'criterion. Start at 100 and read the Explee: search people log — if it says the match count ' +
         'is in the hundreds of thousands, the country is not reaching the request and raising this ' +
         'only buys noise.'),
    text(c, 'max_leads', 'Leads per run',
         'after the filters, ranked best first — up to 1000. Sizes the company search too. ' +
         'Each one costs an email lookup and a model call; a thousand is roughly $50 and an hour.'),
    text(c, 'company_domains', 'Company domains',
         'one per line — fill this in and the flow lists employees at each with LinkFinder ' +
         'instead of searching Explee. Leave empty to search Explee.',
         { area: true, mono: true, rows: 5 }),
    chips(c, 'positive_criteria', 'Should be',
          'Explee scores each company 0-5 against these, +0.1 credit each. It ' +
          'allows three in total across both lists — positives are kept first.'),
    chips(c, 'negative_criteria', 'Should NOT be', 'any match is an automatic skip'),

    el('h2', {}, 'Project notes'),
    el('p', { class: 'hint' }, 'The only facts the agent may state as true. Anything not here, it will not claim.'),
    text(p, 'name', 'Project name'),
    text(p, 'sender_name', 'Sender name', 'the person signing the email — first name is used'),
    text(p, 'facts', 'Facts', null, { area: true, mono: true, rows: 9 }),
    text(p, 'booking_link', 'Booking link', 'offered only after real interest'),
  ];
}

/* ---------------------------------------------------------------- 2. emails
 * One screen, three stages behind a small switch, because the writing is one
 * job — not three tabs' worth.
 */
function promptPreview() {
  // The same composition the workflow embeds, shown here so the prompt is
  // readable before anything is generated. "I don't see the prompt" was a
  // fair complaint: it was only visible inside a downloaded file.
  const wf = n8nWorkflow({ withKeys: false });
  const agent = wf.nodes.find(n => n.type.endsWith('langchain.agent'));
  return agent ? agent.parameters.options.systemMessage : '';
}

function viewEmails() {
  const cur = head(stage);
  const list = D.prompts[stage];

  const counter = el('span', { class: 'n' });
  const ta = el('textarea', { class: 'mono', rows: 14 });
  ta.value = cur.instructions || '';

  const saveBtn = el('button', {
    class: 'b go',
    onclick: () => {
      list.push({ ...cur, version: (cur.version || 0) + 1, instructions: ta.value,
                  language: langSel.value, at: Date.now() });
      save(); say(`saved as v${(cur.version || 0) + 1}`); render();
    },
  }, 'Save version');

  const tick = () => {
    const n = ta.value.length;
    counter.textContent = `${n} / ${MAX_INSTR}`;
    counter.className = 'n' + (n > MAX_INSTR ? ' over' : '');
    saveBtn.disabled = n > MAX_INSTR || ta.value === cur.instructions;
  };
  ta.addEventListener('input', tick);

  const langSel = el('select', {},
    ...[['lead', "the lead's own language"], ['fr', 'French'], ['en', 'English'],
        ['de', 'German'], ['es', 'Spanish']]
      .map(([v, t]) => el('option', { value: v, selected: cur.language === v }, t)));

  const switcher = el('div', { class: 'row', style: 'margin-bottom:6px' },
    ...STAGES.map(([k, label]) => el('button', {
      class: 'b' + (stage === k ? ' go' : ''),
      onclick: () => { stage = k; render(); },
    }, label)));

  tick();

  const extras = stage === 'follow_up' ? [
    el('label', {}, 'Cadence'),
    el('div', { class: 'row' },
      (() => { const i = el('input', { type: 'text', style: 'width:70px' });
        i.value = cur.follow_up_every_days ?? 3;
        i.addEventListener('change', () => { cur.follow_up_every_days = parseInt(i.value, 10) || 3; save(); });
        return i; })(),
      el('span', { style: 'color:var(--muted);font-size:13px' }, 'days apart,'),
      (() => { const i = el('input', { type: 'text', style: 'width:70px' });
        i.value = cur.max_follow_ups ?? 2;
        i.addEventListener('change', () => { cur.max_follow_ups = parseInt(i.value, 10) || 2; save(); });
        return i; })(),
      el('span', { style: 'color:var(--muted);font-size:13px' }, 'of them'),
    ),
  ] : [];

  const history = list.length > 1 ? [
    el('h2', {}, 'Versions'),
    el('table', {}, el('tbody', {}, ...[...list].reverse().map(v => el('tr', {},
      el('td', {}, 'v' + v.version),
      el('td', {}, (v.instructions || '(empty)').slice(0, 60)),
      el('td', { style: 'text-align:right' }, el('a', {
        href: '#', onclick: e => { e.preventDefault(); ta.value = v.instructions; tick();
          say(`loaded v${v.version} — save to make it current`); },
      }, 'restore')),
    )))),
  ] : [];

  return [
    switcher,
    el('label', {}, 'Instructions', counter),
    el('p', { class: 'hint' },
      'Combined with the craft rules in the agent. These win on style — they can never ' +
      'authorise a claim that is not in your project notes.'),
    ta,
    el('div', { class: 'row', style: 'margin-top:12px' }, saveBtn,
      el('span', { style: 'color:var(--muted);font-size:13px' }, `current: v${cur.version || 0}`)),
    el('label', {}, 'Language'),
    langSel,
    ...extras,
    ...history,

    el('h2', {}, 'The whole prompt'),
    el('p', { class: 'hint' },
      'Exactly what the agent node is given, composed from this screen and the ' +
      'Campaign screen. It goes into the workflow as plain text, so what you read ' +
      'here is what the model reads.'),
    (() => {
      const box = el('textarea', { class: 'mono', rows: 18, readonly: true });
      try { box.value = promptPreview(); }
      catch (e) { box.value = 'could not compose: ' + e.message; }
      return box;
    })(),
  ];
}

/* ------------------------------------------------------------------- 3. run
 * The browser cannot reach Explee, Instantly or the model — the secrets and the
 * open network are on the runner. So this asks GitHub to act.
 */
const GH = 'https://api.github.com';
const keys = () => store.get('keys', {});
const repo = () => store.get('repo', DEFAULT_REPO);

async function gh(path, opts = {}) {
  const t = keys().GITHUB_TOKEN;
  if (!t) throw new Error('No GitHub token — add one under Keys.');
  const r = await fetch(`${GH}/repos/${repo()}${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json',
               'X-GitHub-Api-Version': '2022-11-28',
               ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (r.status === 204) return null;
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.message || `GitHub ${r.status}`);
  return b;
}

const ICON = { success: '✓', failure: '✗', cancelled: '–', in_progress: '◦', queued: '·' };

function viewRun() {
  const runs = el('div');

  const refresh = async () => {
    try {
      const d = await gh('/actions/workflows/gtm.yml/runs?per_page=6');
      const rows = d.workflow_runs || [];
      runs.replaceChildren(
        el('h2', {}, 'Recent runs'),
        rows.length
          ? el('table', {}, el('tbody', {}, ...rows.map(r => el('tr', {},
              el('td', {}, (ICON[r.conclusion || r.status] || '?') + '  ' + new Date(r.created_at).toLocaleString()),
              el('td', {}, r.conclusion || r.status),
              el('td', { style: 'text-align:right' },
                 el('a', { href: r.html_url, target: '_blank', rel: 'noopener' }, 'logs')),
            ))))
          : el('p', { class: 'hint' }, 'No runs yet.'),
      );
    } catch (e) {
      runs.replaceChildren(el('h2', {}, 'Recent runs'), el('p', { class: 'note warn' }, e.message));
    }
  };
  refresh();

  const go = (job, apply, label, cls) => el('button', {
    class: 'b ' + cls,
    onclick: async e => {
      if (apply && !confirm('This run can send real email. Continue?')) return;
      e.target.disabled = true;
      try {
        await gh('/actions/workflows/gtm.yml/dispatches', {
          method: 'POST',
          body: JSON.stringify({ ref: 'main', inputs: {
            job, apply: String(apply), campaign: campaignPath().split('/').pop() } }),
        });
        say(`started ${job}${apply ? ' (live)' : ''}`);
        setTimeout(refresh, 2500);
      } catch (err) { say(err.message, true); }
      finally { e.target.disabled = false; }
    },
  }, label);

  const missing = ['EXPLEE_API_KEY', 'INSTANTLY_API_KEY', 'GITHUB_TOKEN']
    .filter(k => !keys()[k]);

  return [
    el('h2', {}, 'Start a run'),
    el('p', { class: 'hint' },
      `Runs on GitHub against ${campaignPath()} — save first if you have edited anything.`),
    el('div', { class: 'row' },
      go('capacity', false, 'Check capacity', 'go'),

const KEYS = [
  ['EXPLEE_API_KEY', 'Explee', 'lead search and enrichment'],
  ['LINKFINDER_API_KEY', 'LinkFinder AI', 'email resolution'],
  ['INSTANTLY_API_KEY', 'Instantly', 'sending'],
  ['OPENROUTER_API_KEY', 'OpenRouter', 'the qualifier and copywriter'],
  ['GITHUB_TOKEN', 'GitHub', 'PAT with Contents + Actions read & write — saves the campaign and starts runs'],
];

$('#keysLink').onclick = () => {
  const saved = keys();
  const f = {};
  const body = el('div');
  for (const [id, label, hint] of KEYS) {
    f[id] = el('input', { type: 'password', id: 'k-' + id, value: saved[id] || '', autocomplete: 'off' });
    body.append(el('label', {}, label, el('span', { style: 'font-weight:400' }, ' · ' + hint)), f[id]);
  }
  const model = el('input', { type: 'text', value: saved.LLM_MODEL || '',
                              placeholder: 'anthropic/claude-opus-4.5' });
  const resolver = el('select', {}, ...[
    ['linkfinder', 'LinkFinder — ours, no marginal cost'],
    ['explee_premium', 'Explee premium — ~$0.05 per found email, ~78%'],
    ['explee_basic', 'Explee basic — ~$0.015 per found email, ~50%'],
  ].map(([v, t]) => el('option', { value: v, selected: (saved.resolver || 'linkfinder') === v }, t)));

  const cmds = () => KEYS.filter(([id]) => f[id].value)
    .map(([id]) => `gh secret set ${id} --body "${f[id].value}"`)
    .concat(model.value.trim() ? [`gh variable set LLM_MODEL --body "${model.value.trim()}"`] : [])
    .join('\n');

  body.append(
    el('label', {}, 'Model'), model,
    el('label', {}, 'Find emails with'), resolver,
    el('p', { class: 'note warn' },
      'These stay in this browser — that is what keeps them safe, and why the agent ' +
      'cannot read them. It runs on GitHub and needs its own copies.'),
    el('div', { class: 'row' },
      el('button', { class: 'b', onclick: async e => {
        const t = cmds();
        if (!t) return say('fill a key first', true);
        try { await navigator.clipboard.writeText(t); e.target.textContent = 'Copied';
              setTimeout(() => { e.target.textContent = 'Copy gh commands'; }, 1800); }
        catch { say('clipboard blocked — use Download instead', true); }
      } }, 'Copy gh commands'),
      el('button', { class: 'b', onclick: () => {
        const lines = KEYS.filter(([id]) => f[id].value).map(([id]) => `${id}=${f[id].value}`);
        if (model.value.trim()) lines.push(`LLM_MODEL=${model.value.trim()}`);
        if (!lines.length) return say('fill a key first', true);
        download('secrets.env', lines.join('\n') + '\n', 'text/plain');
        say('secrets.env downloaded — it is gitignored');
      } }, 'Download secrets.env'),
    ),
  );

  openDialog('API keys', 'Saved in this browser only.', body, () => {
    const out = { resolver: resolver.value };
    if (model.value.trim()) out.LLM_MODEL = model.value.trim();
    for (const [id] of KEYS) { const v = f[id].value.trim(); if (v) out[id] = v; }
    store.set('keys', out);
    say(`${KEYS.filter(([id]) => out[id]).length} of ${KEYS.length} keys saved`);
    if (view === 'run') render();
  });
};

function openDialog(title, sub, body, onOk) {
  $('#dlgTitle').textContent = title;
  $('#dlgSub').textContent = sub;
  $('#dlgBody').replaceChildren(body);
  $('#dlg').showModal();
  $('#dlgOk').onclick = () => { onOk(); $('#dlg').close(); };
}
$('#dlgCancel').onclick = () => $('#dlg').close();

 the value for. The key name is the converter's\n// to decide; when it returned countries we keep its name, else we try the\n// plain one and the request log will show whether Explee accepted it.\nconst hasCountry = Object.keys(out.company_filters).some(k => /countr|geo|location/i.test(k));\nif (!hasCountry && (cfg.countries || []).length) out.company_filters.countries = cfg.countries;\n\nreturn [{ json: { ...out, filters: out.company_filters, page_size: cfg.page_size } }];",
  "instantly_add": "// Add the leads to the Instantly campaign, 100 at a time.\n//\n// Only reached when dry_run is off (the Send? node). skip_if_in_workspace\n// means a person already anywhere in your Instantly is never added twice.\nconst cfg = $('Config').first().json;\nif (!this.helpers || !this.helpers.httpRequest) throw new Error('This n8n has no this.helpers.httpRequest in Code nodes.');\nconst leads = $input.all().map(i => { const { _preview, ...lead } = i.json; return lead; });\nconst CHUNK = 100;\nlet added = 0, skipped = 0;\nconst results = [];\nfor (let i = 0; i < leads.length; i += CHUNK) {\n  const chunk = leads.slice(i, i + CHUNK);\n  let r;\n  try {\n    r = await this.helpers.httpRequest({ method: 'POST', url: 'https://api.instantly.ai/api/v2/leads/list', json: true,\n      headers: { Authorization: 'Bearer ' + cfg.instantly_key, 'Content-Type': 'application/json' },\n      body: { campaign_id: cfg.instantly_campaign_id, skip_if_in_campaign: true, skip_if_in_workspace: true, leads: chunk } });\n  } catch (e) {\n    throw new Error('Instantly rejected chunk ' + (i / CHUNK + 1) + ' (' + chunk.length + ' leads) after ' + added + ' were added: ' + e.message);\n  }\n  const n = Number(r && (r.leads_uploaded ?? r.uploaded ?? r.added ?? r.total_sent ?? chunk.length));\n  added += n; skipped += Math.max(0, chunk.length - n);\n  results.push({ chunk: i / CHUNK + 1, sent: chunk.length, response: r });\n}\nconsole.log('Instantly: ' + added + ' leads added to campaign ' + cfg.instantly_campaign_id + (skipped ? ', ' + skipped + ' skipped as already present' : '') + '. The campaign stays as it was — arm it in Instantly.');\nreturn [{ json: { added, skipped, campaign_id: cfg.instantly_campaign_id, chunks: results.length } }];",
  "normalize": "// One item per lead, in one shape, with a brief the writer can use.\n//\n// Explee answers in snake_case, LinkFinder in camelCase; the brief is the\n// curated subset the writer is allowed to notice. The raw row also carries\n// NACE sector scores, follower counts, photo urls and a company_geo that said\n// CN for Microsoft — noise that dilutes the signal and invites invention.\nconst cfg = $('Config').first().json;\nconst j = $input.first().json || {};\nlet rows = j.people || j.results || j.items || j.contacts || [];\nif (!rows.length) throw new Error('No people reached the writer. Upstream answered: ' + JSON.stringify(j).slice(0, 400));\n\n// Only pay to reach people with a live trigger. Signal-based email runs\n// 5-18% reply against 1-3% generic, and every lead past this point costs an\n// address lookup and a model call — so a lead with nothing happening at their\n// company is the most expensive kind to keep. On by default whenever trigger\n// agents are configured; the drop is logged and, if it takes everyone, the\n// error says so rather than sending nothing quietly.\n// A trigger is anything current and true about the company: what the agents\n// found, or what the search itself said — hiring, a recent round, growth.\nconst builtIn = r => {\n  const s = {};\n  if (r._company_hiring === true) s.hiring = 'the company is hiring right now';\n  if (r._company_funding_date && /^\\d{4}-\\d{2}/.test(String(r._company_funding_date))) {\n    const months = (Date.now() - new Date(r._company_funding_date).getTime()) / 2.6e9;\n    if (months <= 18) s.funding = 'raised' + (r._company_funding_amount ? ' ' + Math.round(r._company_funding_amount / 1e6) + 'M' : '') + ' in ' + String(r._company_funding_date).slice(0, 7);\n  }\n  if (typeof r._company_traffic_growth === 'number' && r._company_traffic_growth >= 30) s.growth = 'web traffic up ' + r._company_traffic_growth + '% year on year';\n  return s;\n};\nrows = rows.map(r => { const b = builtIn(r); const sig = { ...b, ...(r.signal || {}) }; return Object.keys(sig).length ? { ...r, signal: sig } : r; });\n\nconst withSignal = rows.filter(r => r.signal && Object.keys(r.signal).length);\nconst agentsOn = (cfg.signal_agents || []).length > 0;\nif (cfg.require_signal && !agentsOn && !withSignal.length) {\n  // Nothing can feed the gate: no agents were run and the search reported no\n  // hiring / funding / growth on any company. Applying it would drop everyone\n  // for lack of data, not for lack of a trigger — so it is skipped, loudly.\n  console.log('Signal gate skipped: require_signal is on but no agents are configured and the search reported no trigger on any of ' + rows.length + ' companies. Add a signal agent in the console to filter on intent.');\n} else if (cfg.require_signal) {\n  console.log('Signal gate: ' + withSignal.length + ' of ' + rows.length + ' leads have a live trigger; the rest are not emailed');\n  if (!withSignal.length) {\n    throw new Error('None of ' + rows.length + ' qualified leads has a trigger — not hiring, no recent round, no traffic growth, and nothing from ' +\n      ((cfg.signal_agents || []).join(', ') || 'the agents (none configured)') +\n      '. Check the Signals: collect log (was the Wait long enough?), or set require_signal false in Config to email them anyway.');\n  }\n  rows = withSignal;\n}\n\nconst pick = (...v) => v.find(x => x != null && x !== '') ?? '';\nconst NAME = { FR:'France', BE:'Belgium', LU:'Luxembourg', CH:'Switzerland', DE:'Germany', ES:'Spain', IT:'Italy',\n  NL:'Netherlands', PT:'Portugal', IE:'Ireland', GB:'United Kingdom', US:'United States', CA:'Canada' };\nconst placeName = v => { const s = String(v || ''); return /^[A-Za-z]{2}$/.test(s) ? (NAME[s.toUpperCase()] || s) : s; };\nreturn rows.map(c => {\n  const first = pick(c.first_name, c.firstName);\n  const last = pick(c.last_name, c.lastName);\n  const full = pick(c._name, c.full_name, c.name, [first, last].filter(Boolean).join(' '));\n  const lead = {\n    full_name: full,\n    first_name: first || String(full).split(' ')[0] || '',\n    last_name: last || String(full).split(' ').slice(1).join(' '),\n    email: pick(c.email),\n    linkedin_url: pick(c.linkedin_url, c.linkedinUrl, c.linkedin),\n    job_title: pick(c.job_title, c.jobTitle, c.title),\n    company_name: pick(c.company_name, c.company, c._company),\n    company_domain: pick(c.company_domain, c.companyWebsite, c.domain),\n    location: placeName(pick(c.city, c.location, c.country, c.geo)),\n    source: c.source || '',\n    score: c._score ?? null,\n  };\n  const brief = Object.fromEntries(Object.entries({\n    name: full,\n    title: lead.job_title,\n    headline: c.headline,\n    company: lead.company_name,\n    what_the_company_does: pick(c.company_description, c._company_what),\n    industry: pick(c.company_industry, c.industry),\n    company_size: pick(c.company_size, c.companySize),\n    where: lead.location,\n    // The buying trigger, already compacted by the signals node.\n    whats_happening_there: c.signal,\n  }).filter(([, v]) => v != null && v !== ''));\n  return { json: { ...lead, brief, language: cfg.language || 'lead' } };\n});",
  "people": "// Who to write to at each company. Explee first, LinkFinder for the gaps.\n//\n// people-by-domains is a BULK endpoint (up to 1000 domains a request), so at\n// scale this is a handful of calls, not one per company. Explee matches job\n// titles semantically against the target roles and scores each person against\n// the criteria; LinkFinder's seniority bucket covers domains Explee returns\n// nobody for — a live call showed it returning a CFO for \"director\", so it is\n// the fallback, not the lead.\nconst cfg = $('Config').first().json;\nif (!this.helpers || !this.helpers.httpRequest) throw new Error('This n8n has no this.helpers.httpRequest in Code nodes.');\nconst http = opts => this.helpers.httpRequest(opts);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst hasExplee = cfg.explee_key && !cfg.explee_key.startsWith('PUT_');\nconst hasLf = cfg.linkfinder_key && !cfg.linkfinder_key.startsWith('PUT_');\nif (!hasExplee && !hasLf) throw new Error('No Explee or LinkFinder key in Config.');\nconst deadline = Date.now() + (Number(cfg.people_budget_seconds) || 240) * 1000;\nconst left = () => deadline - Date.now();\n\nconst companies = $input.all().map(i => i.json);\nconst meta = Object.fromEntries(companies.map(c => [c.domain, c]));\nconst clean = d => String(d || '').toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/.*$/, '');\nconst out = [];\nconst covered = new Set();\nconst push = (p, via, domain) => {\n  const m = meta[domain] || {};\n  out.push({ ...p, source: via, company_domain: domain, _company: m.company, _company_score: m.score,\n             _company_what: m.what, _company_country: m.country, _company_size: m.size,\n             _company_hiring: m.hiring, _company_funding_date: m.funding_date, _company_funding_amount: m.funding_amount,\n             _company_traffic_growth: m.traffic_growth });\n};\n\n// 1. Explee, in chunks of domains.\nif (hasExplee) {\n  const CHUNK = Number(cfg.people_chunk) || 100;\n  for (let i = 0; i < companies.length && left() > 30000; i += CHUNK) {\n    const domains = companies.slice(i, i + CHUNK).map(c => c.domain);\n    try {\n      const x = await http({ method: 'POST', json: true, timeout: Math.min(120000, left() - 5000),\n        url: 'https://api.explee.com/public/api/v1/search/people-by-domains',\n        headers: { 'X-API-Key': cfg.explee_key },\n        body: { domains, job_titles: (cfg.job_titles || ['Founder', 'Director']).slice(0, 20),\n                criteria: (cfg.criteria || []).slice(0, 3), people_per_company: cfg.per_company } });\n      const rows = (x && (x.people || x.results || x.items)) || [];\n      const perDomain = {};\n      for (const p of rows) {\n        const d = clean(p.company_domain || p.domain || p.company_website) || domains.find(dm => String(p.company_url || '').includes(dm)) || '';\n        if (!d) continue;\n        (perDomain[d] = perDomain[d] || []).push(p);\n      }\n      for (const [d, ps] of Object.entries(perDomain)) {\n        covered.add(d);\n        for (const p of ps.slice(0, cfg.per_company)) push(p, 'explee', d);\n      }\n      console.log('Explee people: chunk ' + (i / CHUNK + 1) + ' -> ' + rows.length + ' people across ' + Object.keys(perDomain).length + ' of ' + domains.length + ' domains');\n    } catch (e) { console.log('Explee people chunk ' + (i / CHUNK + 1) + ': ' + e.message); }\n    await sleep(500);\n  }\n}\n\n// 2. LinkFinder for the domains Explee left empty — capped, because each is\n//    an async job of its own.\nconst gaps = companies.map(c => c.domain).filter(d => !covered.has(d));\nconst lfCap = Number(cfg.linkfinder_fallback_max) || 40;\nif (hasLf && gaps.length) {\n  const auth = { Authorization: 'Bearer ' + cfg.linkfinder_key };\n  const LF = 'https://api.linkfinderai.com';\n  let done = 0;\n  for (const domain of gaps.slice(0, lfCap)) {\n    if (left() < 30000) break;\n    let r;\n    // The entity's own LinkedIn page is the precise key; the domain may be a parent's.\n    const m = meta[domain] || {};\n    const req = m.linkedin_id\n      ? { type: 'linkedin_company_to_employees', input_data: 'https://www.linkedin.com/company/' + m.linkedin_id }\n      : { type: 'company_domain_to_employees', input_data: domain };\n    try {\n      r = await http({ method: 'POST', url: LF, headers: auth, json: true, timeout: 30000, body: {\n        ...req, seniority: cfg.seniority, employee_count: cfg.per_company } });\n    } catch (e) { continue; }\n    for (let n = 0; r && r.job_id && !r.result && n < 6 && left() > 25000; n++) {\n      await sleep(8000);\n      try { r = await http({ method: 'GET', headers: auth, json: true, url: r.poll_url || LF + '/status/' + r.job_id }); }\n      catch (e) { r = null; }\n    }\n    const rows = (r && r.result) || [];\n    for (const p of rows.slice(0, cfg.per_company)) push(p, 'linkfinder', domain);\n    done++;\n    await sleep(600);\n  }\n  console.log('LinkFinder fallback: ' + done + ' of ' + gaps.length + ' uncovered domains tried' + (gaps.length > lfCap ? ' (cap ' + lfCap + ')' : ''));\n}\n\nconsole.log('People: ' + out.length + ' across ' + companies.length + ' companies (' +\n  out.filter(p => p.source === 'explee').length + ' explee, ' + out.filter(p => p.source === 'linkfinder').length + ' linkfinder)');\nif (!out.length) throw new Error('Neither Explee nor LinkFinder found anyone at ' + companies.length + ' companies, e.g. ' + companies.slice(0, 8).map(c => c.domain).join(', '));\nreturn [{ json: { people: out } }];",
  "people_search": "// Explee's people search, with the ICP as request filters. No domain hop.\n//\n// The company search returns entities mapped onto a parent's web domain\n// (\"ESIC - Centre de formation\" on microsoft.com), so domain -> people hands\n// you the parent's staff. This asks Explee for the PEOPLE directly — target\n// roles as people_filters, the structured company filters from nl-to-filters\n// as company_filters — and Explee joins person to company on its own\n// identity, not on a domain. Each row comes back with its company fields.\n//\n// 1 credit per person (+0.1 per criterion), first 100 free. The request is\n// logged in full and so is meta.total, because the last two sourcing\n// attempts failed silently and that is not allowed to happen a third time.\nconst cfg = $('Config').first().json;\nconst f = $input.first().json || {};\nif (!this.helpers || !this.helpers.httpRequest) throw new Error('This n8n has no this.helpers.httpRequest in Code nodes.');\nif (!cfg.explee_key || cfg.explee_key.startsWith('PUT_')) throw new Error('No Explee key in Config.');\n\nconst company_filters = { ...(f.company_filters || f.filters || {}) };\ndelete company_filters.criteria;                       // criteria score people here, not companies\nconst people_filters = { ...(f.people_filters || {}) };\npeople_filters.job_titles = (people_filters.job_titles || cfg.job_titles || ['Founder', 'Director']).slice(0, 20);\nconst criteria = (cfg.criteria || []).slice(0, 3);\nif (criteria.length) people_filters.criteria = criteria;\n\nconst body = { people_filters, company_filters, page_size: Number(cfg.page_size) || 100 };\nconsole.log('People search request: ' + JSON.stringify(body));\n\nlet res;\ntry {\n  res = await this.helpers.httpRequest({ method: 'POST', json: true, timeout: 120000,\n    url: 'https://api.explee.com/public/api/v1/search/people',\n    headers: { 'X-API-Key': cfg.explee_key }, body });\n} catch (e) {\n  // Explee's 4xx bodies name the offending field (\"Maximum 3 criteria\n  // allowed\"); surface it verbatim rather than guessing at a fix.\n  throw new Error('Explee /search/people rejected the request: ' + e.message + ' — request was ' + JSON.stringify(body).slice(0, 600));\n}\n\nconst rows = (res && (res.people || res.results || res.items)) || [];\nconst meta = (res && res.meta) || {};\nconst clean = d => String(d || '').trim().toLowerCase().replace(/^https?:\\/\\//, '').replace(/^www\\./, '').replace(/\\/.*$/, '');\nconst num = v => { const n = Number(String(v ?? '').replace(/[,\\s]/g, '').match(/\\d+(\\.\\d+)?/)?.[0]); return isNaN(n) ? null : n; };\n// \"1001-5000\" -> 5000: a size range is read at its upper bound, the same way\n// Qualify reads it, so a ceiling of 200 drops \"201-500\" and keeps \"51-200\".\nconst sizeNum = v => { const ns = String(v ?? '').replace(/[,\\s]/g, '').match(/\\d+/g); return ns ? Math.max(...ns.map(Number)) : null; };\n\nconst people = rows.map(p => {\n  const c = p.company || {};\n  return { ...p, source: 'explee',\n    company_domain: clean(p.company_domain || c.domain || p.company_website),\n    _company: p.company_name || c.name || '',\n    // People rows carry the person's geo; the company's when the API gives it.\n    _company_country: p.company_geo || c.geo || p.geo || p.country_code || '',\n    _company_size: sizeNum(p.company_size ?? c.size),\n    _company_what: p.company_description || c.description || '',\n    _company_hiring: p.company_hiring === true || c.hiring === true,\n    _company_funding_date: p.company_funding_last_round_date || c.funding_last_round_date || null,\n    _company_funding_amount: num(p.company_funding_last_round_amount ?? c.funding_last_round_amount),\n    _company_traffic_growth: num(p.company_traffic_growth ?? c.traffic_growth),\n    _company_revenue: num(p.company_revenue_annual ?? c.revenue_annual),\n    _company_sales_team: num(p.company_employees_count_sales ?? (c.employees_by_department || {}).employees_count_sales),\n  };\n});\n\nconst total = num(meta.total);\nconsole.log('People search: ' + people.length + ' people returned' + (total !== null ? ' of ' + total.toLocaleString() + ' matched' : '') +\n  ', credits ' + (meta.credits_charged ?? '?') + ', balance ' + (meta.remaining_balance ?? '?') +\n  (people.length ? ' | e.g. ' + people.slice(0, 3).map(p => (p.first_name || p.name) + ' · ' + (p.title || p.job_title) + ' · ' + p._company + ' ' + (p.geo || '')).join(' / ') : ''));\nif (total !== null && total > 200000) {\n  console.log('WARNING: ' + total.toLocaleString() + ' people matched — the company_filters are not narrowing. Check the Filters node: ' +\n    'if nl-to-filters gave nothing, the fallback is prose and the country is not being applied in the request.');\n}\nif (!people.length) {\n  throw new Error('Explee /search/people returned no people. Response keys: ' + Object.keys(res || {}).join(', ') +\n    ' | meta: ' + JSON.stringify(meta).slice(0, 300) + ' | request: ' + JSON.stringify(body).slice(0, 500));\n}\nreturn [{ json: { people } }];",
  "qualify": "// The gate. Runs before anything that costs credits per person.\n//\n// Semantic title matching is how Explee finds people and why it over-returns;\n// Explee's own AutoGTM log shows \"Head of Sales Operations\" bleeding into 32k\n// generic \"Head of Sales\", fixed by requiring a literal on-target word in the\n// real title. This does that, plus country, size, the criterion score, and a\n// ranking so the cap downstream keeps the best rather than the first.\nconst cfg = $('Config').first().json;\nconst people = $input.first().json.people || [];\nconst norm = s => String(s || '').toLowerCase();\n\n// Title words: configured, else derived from the target roles so the gate\n// is on by default. Short function words are not evidence of anything.\nconst STOP = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'et', 'of', 'the', 'and', 'in', 'at', 'for', 'en', 'a', 'à']);\nconst derived = (cfg.job_titles || []).flatMap(t => norm(t).split(/[\\s\\-\\/,]+/))\n  .filter(w => w.length > 2 && !STOP.has(w));\nconst want = ((cfg.title_keywords || []).length ? cfg.title_keywords : derived).map(norm).filter(Boolean);\nconst banned = (cfg.title_exclude || []).map(norm).filter(Boolean);\nconst allowed = (cfg.countries || []).map(c => String(c).toUpperCase());\nconst floor = Number(cfg.min_company_size) || 0;\nconst ceiling = Number(cfg.max_company_size) || 0;\nconst maxSales = Number(cfg.max_sales_team) || 0;\nconst maxRevenue = Number(cfg.max_revenue) || 0;\nconst minScore = Number(cfg.min_criterion_score) || 0;\n\nconst titleOf = p => norm(p.job_title || p.jobTitle || p.title) + ' ' + norm(p.headline);\n// Country as an ISO code whatever form it arrives in. \"Belgium\" sliced to two\n// letters is \"BE\" by luck; \"Germany\" would be \"GE\". Map names, keep codes.\nconst ISO = { france:'FR', belgium:'BE', belgique:'BE', luxembourg:'LU', switzerland:'CH', suisse:'CH', germany:'DE',\n  allemagne:'DE', spain:'ES', espagne:'ES', italy:'IT', italie:'IT', netherlands:'NL', 'pays-bas':'NL', portugal:'PT',\n  ireland:'IE', irlande:'IE', 'united kingdom':'GB', uk:'GB', 'united states':'US', usa:'US', canada:'CA',\n  russia:'RU', china:'CN', india:'IN', poland:'PL', austria:'AT', sweden:'SE', denmark:'DK', norway:'NO' };\nconst iso = v => { const s = String(v || '').trim(); if (!s) return '';\n  if (/^[A-Za-z]{2}$/.test(s)) return s.toUpperCase(); return ISO[s.toLowerCase()] || ''; };\nconst countryOf = p => iso(p.geo || p.country_code || p.country || p._company_country);\nconst size = p => {\n  if (typeof p._company_size === 'number') return p._company_size;\n  const nums = String(p.company_size || p.companySize || '').replace(/[,\\s]/g, '').match(/\\d+/g);\n  return nums ? Math.max(...nums.map(Number)) : null;\n};\n// Score against the FIRST criterion only. Summing buries a hard no under\n// two soft yeses — their log calls that out too.\nconst score = p => {\n  const c = p.criteria || p.criteria_scores || p.scores;\n  if (!c) return null;\n  const list = Array.isArray(c) ? c : Object.values(c);   // real shape: object keyed by criterion text\n  if (!list.length) return null;\n  const v = list[0];\n  const n = Number(typeof v === 'object' ? (v.score ?? v.value) : v);\n  return isNaN(n) ? null : n;\n};\n\nconst dropped = { title: 0, banned: 0, country: 0, size: 0, sales_team: 0, revenue: 0, score: 0, noname: 0 };\nconst kept = [];\nfor (const p of people) {\n  const name = p.full_name || p.name || [p.first_name || p.firstName, p.last_name || p.lastName].filter(Boolean).join(' ');\n  if (!name) { dropped.noname++; continue; }\n  const t = titleOf(p);\n  if (want.length && !want.some(w => t.includes(w))) { dropped.title++; continue; }\n  if (banned.some(b => t.includes(b))) { dropped.banned++; continue; }\n  const cc = countryOf(p);\n  if (allowed.length && cc && !allowed.includes(cc)) { dropped.country++; continue; }\n  const n = size(p);\n  if (floor && n !== null && n < floor) { dropped.size++; continue; }\n  if (ceiling && n !== null && n > ceiling) { dropped.size++; continue; }\n  if (maxSales && typeof p._company_sales_team === 'number' && p._company_sales_team > maxSales) { dropped.sales_team++; continue; }\n  if (maxRevenue && typeof p._company_revenue === 'number' && p._company_revenue > maxRevenue) { dropped.revenue++; continue; }\n  const sc = score(p);\n  if (minScore && sc !== null && sc < minScore) { dropped.score++; continue; }\n  kept.push({ ...p, _score: sc, _name: name });\n}\n\n// Best first: person score, then company score, then the ones Explee found.\nkept.sort((a, b) =>\n  ((b._score ?? 2.5) - (a._score ?? 2.5)) ||\n  ((b._company_score ?? 2.5) - (a._company_score ?? 2.5)) ||\n  ((a.source === 'explee' ? 0 : 1) - (b.source === 'explee' ? 0 : 1)));\n\nconst cap = Number(cfg.max_leads) || kept.length;\nconst final = kept.slice(0, cap);\n\nconsole.log('Qualify: kept ' + final.length + ' of ' + people.length +\n  ' (dropped ' + JSON.stringify(dropped) + (kept.length > cap ? ', ' + (kept.length - cap) + ' past max_leads' : '') +\n  '); title words: ' + want.join('|'));\n\nif (!final.length) {\n  throw new Error('Nothing survived Qualify. ' + people.length + ' in, dropped ' + JSON.stringify(dropped) +\n    '. Title words were [' + want.join(', ') + '], countries [' + allowed.join(', ') + ']. Titles seen: ' +\n    [...new Set(people.map(p => p.job_title || p.jobTitle || p.title))].slice(0, 12).join(' | '));\n}\nreturn [{ json: { people: final } }];",

    '- "Quick question", "circle back", "touch base", "synergy", "leverage"',
    '- "simply", "just", "easily", "solution", "game-changer", "revolutionary"',
    '- Compliments on their website, growth or "impressive work"',
    '- A second ask, a P.S., a signature block, links, or an unsubscribe line',
    '- Anything you were not told above',
    '',
    first.instructions ? '## EXTRA INSTRUCTIONS FOR THIS CAMPAIGN\n' + first.instructions + '\n' : null,
    '## TWO FOLLOW-UPS, WRITTEN NOW',
    'They go out 3 and 6 days later in the same thread if there is no reply, so',
    'they must read as the same person continuing, not restarting. Each one:',
    '- 30-55 words. Shorter than the first email. No greeting needed.',
    '- A NEW angle each time — never "just following up", never a summary of',
    '  the first email, never "did you see my email".',
    '- Follow-up 1: the cost of waiting — what a quarter without prospecting',
    '  costs a company like theirs, in one concrete line. Then the same ask.',
    '- Follow-up 2: give something — offer to send a sample list of 20',
    '  prospects in their segment, free, no call needed. Ask only whether they',
    '  want it. This is the last message; do not say so.',
    followUp.instructions ? 'Campaign notes for the follow-ups: ' + followUp.instructions : null,
    '',
    '## OUTPUT',
    'Reply with JSON and nothing else — no code fence, no sentence before or after:',
    '{"email": "<the email address you were given, unchanged>", "name": "<their name>",',
    ' "company": "<their company>", "subject": "...", "body": "...",',
    ' "followup_1": "...", "followup_2": "..."}',
    'Use \\n for line breaks inside body.',
  ].filter(x => x !== null && x !== undefined).join('\n').replace(/\n{3,}/g, '\n\n').trim();

  // ------------------------------------------------------- the nodes
  const node = (name, type, typeVersion, parameters, pos, extra = {}) =>
    ({ parameters, id: uid(), name, type: 'n8n-nodes-base.' + type, typeVersion, position: pos, ...extra });
  const code = (name, key, pos, extra) => node(name, 'code', 2, { jsCode: NODE_SRC[key] }, pos, extra);
  const http = (name, params, pos, extra) => node(name, 'httpRequest', 4.2, params, pos, extra);
  const explee = (path, jsonBody) => ({
    method: 'POST', url: 'https://api.explee.com/public/api/v1' + path,
    sendHeaders: true, headerParameters: { parameters: [{ name: 'X-API-Key', value: "={{ $('Config').first().json.explee_key }}" }] },
    sendBody: true, specifyBody: 'json', jsonBody, options: {},
  });

  const manual = cfg.domains.length > 0;
  let x = -40;
  const next = () => (x += 220, [x, 300]);

  const nodes = [
    node('Start', 'manualTrigger', 1, {}, next()),
    node('Config', 'code', 2, { jsCode:
      '// Everything from the console. Edit here and the whole flow follows.\n' +
      '// dry_run true: write the emails, never call Instantly. Read them in\n' +
      "// 'Build the lead'. Flip to false when the copy is right.\n" +
      'return [{ json: ' + JSON.stringify(cfg, null, 2) + ' }];' }, next()),
    code('Instantly: check campaign', 'check_campaign', next()),
    ...(manual ? [
      // Your own domain list: people at each, by LinkedIn company id when the
      // list carries one, else by domain.
      code('Domains', 'domains', next()),
      code('People at each domain', 'people', next()),
    ] : [
      // Explee's own free converter from the ICP prose to its structured
      // filters. Continues on error so a hiccup falls back to prose.
      http('Explee: nl-to-filters',
           explee('/search/nl-to-filters', "={{ JSON.stringify({ query: $('Config').first().json.icp }) }}"),
           next(), { onError: 'continueRegularOutput' }),
      code('Filters', 'filters', next()),
      // People directly, with the ICP as request filters. Explee joins person
      // to company on its own identity, so a "training centre" that Explee
      // files under microsoft.com does not hand us Microsoft's staff.
      code('Explee: search people', 'people_search', next()),
    ]),
    code('Qualify', 'qualify', next()),
    // Start every agent run, wait once, collect every result. A thousand
    // async jobs without a polling loop and inside the per-node time limit.
    code('Signals: start', 'signals_start', next()),
    node('Wait for the agents', 'wait', 1.1, { amount: 120, unit: 'seconds' }, next()),
    code('Signals: collect', 'signals_collect', next()),
    code('One item per lead', 'normalize', next()),
    // Email resolution in batches of 60. Each batch is its own Code node run,
    // so a thousand leads never meets the 300s limit. The loop is over a
    // finite list and terminates by construction — unlike the Wait/If poll on
    // an external job that hung the early versions.
    node('Loop Over Items', 'splitInBatches', 3, { batchSize: 60, options: {} }, next()),
    code('LinkFinder: fill missing emails', 'resolve', [x, 480]),
    // An AI Agent: model is a dropdown, prompt is a field, and when the writer
    // needs tools later this is already the right shape. Node type and version
    // copied from the agent in the live LinkFinder workflow.
    {
      parameters: {
        promptType: 'define',
        text: "={{ 'Write one cold email to this person. Their email address is ' + $json.email + '.\\n\\n' + JSON.stringify($json.brief, null, 2) }}",
        options: { systemMessage: systemPrompt },
      },
      id: uid(), name: 'Write the email', type: '@n8n/n8n-nodes-langchain.agent', typeVersion: 3.1, position: next(),
    },
    // Pick your existing OpenAI credential here (the one pointed at OpenRouter).
    {
      parameters: { model: "={{ $('Config').first().json.model }}", options: {} },
      id: uid(), name: 'Model', type: '@n8n/n8n-nodes-langchain.lmChatOpenAi', typeVersion: 1.1, position: [x, 480],
    },
    code('Build the lead', 'build_lead', next()),
    node('Send?', 'if', 2, {
      conditions: {
        options: { caseSensitive: true, leftValue: '', typeValidation: 'loose', version: 2 },
        conditions: [{ id: uid(), leftValue: "={{ $('Config').first().json.dry_run }}", rightValue: false,
                       operator: { type: 'boolean', operation: 'false', singleValue: true } }],
        combinator: 'and',
      }, options: {},
    }, next()),
    code('Instantly: add leads', 'instantly_add', next()),
  ];

  // One straight line derived from the node list, so nothing can be left
  // dangling. The model hangs off the agent; Send?'s false branch ends.
  const chain = nodes.filter(n => !['Model', 'LinkFinder: fill missing emails'].includes(n.name));
  const connections = {};
  const to = name => [{ node: name, type: 'main', index: 0 }];
  chain.slice(0, -1).forEach((n, i) => {
    const nxt = chain[i + 1].name;
    if (n.name === 'Send?') connections[n.name] = { main: [to(nxt), []] };
    // splitInBatches v3: output 0 is "done" (everything, once), output 1 is
    // the current batch. The batch goes to the resolver, which feeds back in.
    else if (n.name === 'Loop Over Items') connections[n.name] = { main: [to(nxt), to('LinkFinder: fill missing emails')] };
    else connections[n.name] = { main: [to(nxt)] };
  });
  connections['LinkFinder: fill missing emails'] = { main: [to('Loop Over Items')] };
  connections.Model = { ai_languageModel: [[{ node: 'Write the email', type: 'ai_languageModel', index: 0 }]] };

  return {
    name: (c.name || 'GTM') + ' — Explee to Instantly',
    nodes, connections,
    settings: { executionOrder: 'v1' },
    pinData: {},
  };
}

function downloadN8n(withKeys) {
  const wf = n8nWorkflow({ withKeys });
  const name = (D.campaign.name || 'gtm').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.n8n.json';
  download(name, JSON.stringify(wf, null, 2), 'application/json');
  say(withKeys ? `${name} — contains your API keys, keep it local`
                : `${name} — keys left as placeholders`);
}

/* ------------------------------------------------------------ save to repo
 * GitHub is the backend. The console PUTs campaigns/<slug>.json through the
 * contents API and the workflow reads it from the checkout — so editing here
 * and running there is one loop, with no file passing through your downloads
 * folder and no server of our own.
 *
 * Needs the PAT to carry Contents: read and write as well as Actions.
 */
const b64 = str => {
  // btoa is latin-1 only; campaign copy is not.
  const bytes = new TextEncoder().encode(str);
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
};

const campaignPath = () =>
  'campaigns/' + ((D.campaign.name || 'campaign').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) + '.json';

async function saveToRepo(btn) {
  const path = campaignPath();
  const body = JSON.stringify(exportShape(), null, 2) + '\n';
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    // An update needs the blob sha; a create must not send one.
    let sha;
    try {
      const cur = await gh(`/contents/${path}?ref=main`);
      sha = cur?.sha;
    } catch (e) {
      if (!/404|not found/i.test(e.message)) throw e;
    }
    await gh(`/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({
        message: `Update ${path} from the console`,
        content: b64(body), branch: 'main', ...(sha ? { sha } : {}),
      }),
    });
    store.set('campaign_path', path);
    say(`saved ${path} to ${repo()}`);
  } catch (e) {
    say(e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

/* --------------------------------------------------------------- download */
function download(name, text, type) {
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}

// The shape run.py load_config() already reads.
function exportShape() {
  return {
    project: { ...D.project },
    campaign: { ...D.campaign },
    prompts: STAGES.map(([s]) => {
      const h = head(s);
      return { stage: s, instructions: h.instructions || '', language: h.language || 'lead',
               follow_up_every_days: h.follow_up_every_days ?? 3,
               max_follow_ups: h.max_follow_ups ?? 2 };
    }),
  };
}

function exportJson() {
  const name = campaignPath().split('/').pop();
  download(name, JSON.stringify(exportShape(), null, 2), 'application/json');
  say(`downloaded ${name}`);
}

/* ------------------------------------------------------------------ render */
function render() {
  store.set('view', view);
  document.querySelectorAll('nav button[data-v]').forEach(b => {
    b.classList.toggle('on', b.dataset.v === view);
  });
  const body = { campaign: viewCampaign, emails: viewEmails, run: viewRun }[view]();
  $('#main').replaceChildren(...body.filter(Boolean),
    el('div', { class: 'row', style: 'margin-top:44px;padding-top:20px;border-top:1px solid var(--line)' },
      el('button', { class: 'b go', onclick: e => saveToRepo(e.target) }, 'Save'),
      el('button', { class: 'b', onclick: exportJson, title: 'download a copy instead' }, 'Download'),
      el('span', { class: 'hint', style: 'margin:0' },
         keys().GITHUB_TOKEN ? `commits ${campaignPath()}` : 'add a GitHub token under Keys to save'),
      el('span', { style: 'flex:1' }),
      el('button', { class: 'b', title: 'light / dark', onclick: () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next); store.set('theme', next);
      } }, '◐'),
    ));
}

document.querySelectorAll('nav button[data-v]').forEach(b => {
  b.onclick = () => { view = b.dataset.v; render(); };
});
if (store.get('theme')) document.documentElement.setAttribute('data-theme', store.get('theme'));
render();
</script>
