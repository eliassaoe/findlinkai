<style>
:root{
  --bg:#fcfcfb; --ink:#191817; --muted:#75706a; --line:#e6e3dd;
  --accent:#2f5d50; --soft:#edf2f0; --danger:#a33a2a;
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17181b; --ink:#eae8e4; --muted:#948f88; --line:#2c2f34;
  --accent:#82bba7; --soft:#1e2a26; --danger:#d98675;
}}
:root[data-theme=dark]{
  --bg:#17181b; --ink:#eae8e4; --muted:#948f88; --line:#2c2f34;
  --accent:#82bba7; --soft:#1e2a26; --danger:#d98675;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 24px 80px}

header{display:flex;align-items:baseline;gap:12px;padding:28px 0 20px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.02em}
header .sp{flex:1}
#status{font-size:13px;color:var(--muted)}
#status.err{color:var(--danger)}

/* One row of plain-text switches. No tab chrome. */
nav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:28px}
nav button{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;
  padding:0 0 10px;margin-bottom:-1px;border-bottom:1.5px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav .sp{flex:1}
nav a{color:var(--muted);text-decoration:none;font-size:13px;padding-bottom:10px;cursor:pointer}
nav a:hover{color:var(--accent)}

h2{font-size:14px;font-weight:600;margin:34px 0 2px;letter-spacing:-.01em}
h2:first-of-type{margin-top:0}
p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}

label{display:block;margin:18px 0 5px;font-size:13px;font-weight:500;color:var(--muted)}
label .n{float:right;font-weight:400;font-variant-numeric:tabular-nums}
label .n.over{color:var(--danger)}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;
  background:transparent;color:inherit;font:inherit}
textarea{resize:vertical;min-height:76px}
textarea.mono{font-family:var(--mono);font-size:13px;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}

button.b{border:1px solid var(--line);background:transparent;color:inherit;font:inherit;
  padding:7px 14px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--accent);color:var(--accent)}
button.b.go{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.go:hover{color:#fff;opacity:.9}
button.b.risk{border-color:var(--danger);color:var(--danger)}
button.b.risk:hover{background:var(--danger);color:#fff}
button.b:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--accent);
  border-radius:5px;padding:3px 9px;font-size:13px;margin:0 6px 6px 0}
.chip button{border:0;background:none;color:inherit;cursor:pointer;opacity:.55;padding:0;font-size:15px;line-height:1}
.chip button:hover{opacity:1}
.chips input{width:auto;min-width:170px;margin-top:2px;border-style:dashed}

.note{color:var(--muted);font-size:13px;margin:12px 0;padding-left:12px;border-left:2px solid var(--line)}
.note.warn{border-left-color:var(--danger)}
code{font-family:var(--mono);font-size:12.5px}

table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
td{padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted)}
td:first-child{color:var(--ink);width:1%;white-space:nowrap;padding-right:14px}
td a{color:var(--accent)}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
  padding:24px;max-width:520px;width:92vw}
dialog::backdrop{background:#0009}
dialog h3{margin:0 0 4px;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* GTM Console — one campaign, three screens.
 *
 * Everything is in localStorage. No database, no login, no library. The agent
 * runs on GitHub Actions, so the two handoffs are: Download JSON (the config,
 * in the exact shape run.py load_config reads) and the Run screen (dispatches
 * the workflow through the GitHub API, which sends CORS headers).
 *
 * Deliberately one campaign at a time. Multi-client lives in the JSON files —
 * one per campaign, committed — which is simpler than a sidebar tree for one
 * operator, and is what the runner reads anyway.
 */
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : String(k));
  return n;
};
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const STAGES = [['first_email', 'First email'], ['follow_up', 'Follow-ups'], ['reply', 'Replies']];
const MAX_INSTR = 3000;            // matches models.py and the schema CHECK
const DEFAULT_REPO = 'eliassaoe/findlinkai';

let view = store.get('view', 'campaign');
let stage = 'first_email';

function say(m, err) {
  const n = $('#status');
  n.textContent = m || ''; n.className = err ? 'err' : '';
  if (m && !err) setTimeout(() => { if (n.textContent === m) n.textContent = ''; }, 3000);
}

/* ---------------------------------------------------------------- the data
 * One object. Prompts are a list because they are versioned: saving appends,
 * never overwrites, so a change in reply rate is attributable to a change in
 * the prompt.
 */
const BLANK = {
  project: { name: '', domain: '', facts: '', booking_link: '', cc_email: '',
             sending_emails: [], daily_cap: 135 },
  campaign: { name: '', kind: 'b2b', offer: '', customer_problem: '', example_clients: [],
              keywords: [], target_role: '', target_geography: '',
              positive_criteria: [], negative_criteria: [], instantly_campaign_id: null },
  prompts: { first_email: [], follow_up: [], reply: [] },
};

const SEED = {
  project: {
    name: 'linkfinderai.com', domain: 'linkfinderai.com',
    facts: 'LinkFinder AI turns a name, company, email or LinkedIn URL into a verified business email or phone number. Plans start at $49/month for 5,000 credits. A LinkedIn-profile-to-email lookup costs 10 credits.\n\nThe outbound service: we build the list, write the campaign, run the sending and handle replies. You pay per meeting held.',
    booking_link: 'https://calendly.com/hamoureliasse/offre-linkfinder-ai-outbound/',
    cc_email: 'support@linkfinderai.com', sending_emails: [], daily_cap: 135,
  },
  campaign: {
    name: 'organismes de formation FR/BE/LU', kind: 'b2b',
    offer: 'Outbound run end to end, paid per meeting held.',
    customer_problem: 'Prospecting stops whenever the team is delivering training, so the pipeline arrives in waves.',
    example_clients: ['Cegos', 'Demos', 'Orsys'],
    keywords: ['organisme de formation', 'centre de formation'],
    target_role: 'Dirigeant, responsable commercial',
    target_geography: 'France, Belgique, Luxembourg',
    positive_criteria: ['Vente B2B active', 'Equipe commerciale de moins de 5'],
    negative_criteria: ['Formation purement subventionnee', 'Plus de 200 salaries'],
    instantly_campaign_id: null,
  },
  prompts: {
    first_email: [{ version: 1, instructions: 'Ask for a reply, not a call. Never mention a discount. Name the pay-per-meeting model once — it is the whole reason this offer is different — and do not explain it twice.', language: 'lead', at: Date.now() }],
    follow_up: [{ version: 1, instructions: 'New angle each time. Follow-up 1: the cost of waiting a quarter. Follow-up 2: offer a sample list of 20 prospects, free, no call needed.', language: 'lead', follow_up_every_days: 3, max_follow_ups: 2, at: Date.now() }],
    reply: [{ version: 1, instructions: 'Only facts from the project notes. No pressure. Send the booking link only once they have shown real interest.', language: 'lead', at: Date.now() }],
  },
};

let D = store.get('gtm', null);
if (!D) { D = SEED; store.set('gtm', D); }
for (const k of Object.keys(BLANK)) D[k] = { ...BLANK[k], ...(D[k] || {}) };

const save = () => store.set('gtm', D);
const head = s => (D.prompts[s] || []).slice(-1)[0] || { version: 0, instructions: '', language: 'lead' };

/* ------------------------------------------------------------------ fields */
function text(obj, key, label, hint, { area = false, mono = false, rows = 3 } = {}) {
  const i = el(area ? 'textarea' : 'input', area ? { rows, class: mono ? 'mono' : '' } : { type: 'text' });
  i.value = obj[key] ?? '';
  i.addEventListener('change', () => { obj[key] = i.value; save(); say('saved'); });
  return el('div', {}, el('label', {}, label, hint ? el('span', { style: 'font-weight:400' }, ' · ' + hint) : null), i);
}

function chips(obj, key, label, hint) {
  const box = el('div', { class: 'chips' });
  const draw = () => box.replaceChildren(
    ...(obj[key] || []).map((v, i) => el('span', { class: 'chip' }, v,
      el('button', { title: 'remove', onclick: () => { obj[key].splice(i, 1); save(); draw(); } }, '×'))),
    el('input', {
      type: 'text', placeholder: '+ add',
      onkeydown: e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const v = e.target.value.trim();
        if (!v) return;
        (obj[key] ||= []).push(v); save(); e.target.value = ''; draw();
      },
    }),
  );
  draw();
  return el('div', {}, el('label', {}, label, hint ? el('span', { style: 'font-weight:400' }, ' · ' + hint) : null), box);
}

/* -------------------------------------------------------------- 1. campaign
 * Offer, audience and the facts, on one screen. They are one decision — what
 * you sell and who to — and splitting them across three tabs made it feel
 * bigger than it is.
 */
function viewCampaign() {
  const p = D.project, c = D.campaign;
  return [
    el('h2', {}, 'Offer'),
    el('p', { class: 'hint' }, 'What this campaign sells, and to whom.'),
    text(c, 'name', 'Campaign name'),
    text(c, 'offer', 'What you offer', null, { area: true }),
    text(c, 'customer_problem', 'The problem they have', null, { area: true }),
    chips(c, 'example_clients', 'Example clients'),

    el('h2', {}, 'Audience'),
    el('p', { class: 'hint' }, 'The qualifier re-checks every lead against these — judgement, not just search filters.'),
    text(c, 'target_role', 'Target role', 'comma separated'),
    text(c, 'target_geography', 'Geography'),
    chips(c, 'keywords', 'Company keywords', 'what kind of company — bounds the search'),
    chips(c, 'positive_criteria', 'Should be'),
    chips(c, 'negative_criteria', 'Should NOT be', 'any match is an automatic skip'),

    el('h2', {}, 'Project notes'),
    el('p', { class: 'hint' }, 'The only facts the agent may state as true. Anything not here, it will not claim.'),
    text(p, 'name', 'Project name'),
    text(p, 'facts', 'Facts', null, { area: true, mono: true, rows: 9 }),
    text(p, 'booking_link', 'Booking link', 'offered only after real interest'),
  ];
}

/* ---------------------------------------------------------------- 2. emails
 * One screen, three stages behind a small switch, because the writing is one
 * job — not three tabs' worth.
 */
function viewEmails() {
  const cur = head(stage);
  const list = D.prompts[stage];

  const counter = el('span', { class: 'n' });
  const ta = el('textarea', { class: 'mono', rows: 14 });
  ta.value = cur.instructions || '';

  const saveBtn = el('button', {
    class: 'b go',
    onclick: () => {
      list.push({ ...cur, version: (cur.version || 0) + 1, instructions: ta.value,
                  language: langSel.value, at: Date.now() });
      save(); say(`saved as v${(cur.version || 0) + 1}`); render();
    },
  }, 'Save version');

  const tick = () => {
    const n = ta.value.length;
    counter.textContent = `${n} / ${MAX_INSTR}`;
    counter.className = 'n' + (n > MAX_INSTR ? ' over' : '');
    saveBtn.disabled = n > MAX_INSTR || ta.value === cur.instructions;
  };
  ta.addEventListener('input', tick);

  const langSel = el('select', {},
    ...[['lead', "the lead's own language"], ['fr', 'French'], ['en', 'English'],
        ['de', 'German'], ['es', 'Spanish']]
      .map(([v, t]) => el('option', { value: v, selected: cur.language === v }, t)));

  const switcher = el('div', { class: 'row', style: 'margin-bottom:6px' },
    ...STAGES.map(([k, label]) => el('button', {
      class: 'b' + (stage === k ? ' go' : ''),
      onclick: () => { stage = k; render(); },
    }, label)));

  tick();

  const extras = stage === 'follow_up' ? [
    el('label', {}, 'Cadence'),
    el('div', { class: 'row' },
      (() => { const i = el('input', { type: 'text', style: 'width:70px' });
        i.value = cur.follow_up_every_days ?? 3;
        i.addEventListener('change', () => { cur.follow_up_every_days = parseInt(i.value, 10) || 3; save(); });
        return i; })(),
      el('span', { style: 'color:var(--muted);font-size:13px' }, 'days apart,'),
      (() => { const i = el('input', { type: 'text', style: 'width:70px' });
        i.value = cur.max_follow_ups ?? 2;
        i.addEventListener('change', () => { cur.max_follow_ups = parseInt(i.value, 10) || 2; save(); });
        return i; })(),
      el('span', { style: 'color:var(--muted);font-size:13px' }, 'of them'),
    ),
  ] : [];

  const history = list.length > 1 ? [
    el('h2', {}, 'Versions'),
    el('table', {}, el('tbody', {}, ...[...list].reverse().map(v => el('tr', {},
      el('td', {}, 'v' + v.version),
      el('td', {}, (v.instructions || '(empty)').slice(0, 60)),
      el('td', { style: 'text-align:right' }, el('a', {
        href: '#', onclick: e => { e.preventDefault(); ta.value = v.instructions; tick();
          say(`loaded v${v.version} — save to make it current`); },
      }, 'restore')),
    )))),
  ] : [];

  return [
    switcher,
    el('label', {}, 'Instructions', counter),
    el('p', { class: 'hint' },
      'Combined with the craft rules in the agent. These win on style — they can never ' +
      'authorise a claim that is not in your project notes.'),
    ta,
    el('div', { class: 'row', style: 'margin-top:12px' }, saveBtn,
      el('span', { style: 'color:var(--muted);font-size:13px' }, `current: v${cur.version || 0}`)),
    el('label', {}, 'Language'),
    langSel,
    ...extras,
    ...history,
  ];
}

/* ------------------------------------------------------------------- 3. run
 * The browser cannot reach Explee, Instantly or the model — the secrets and the
 * open network are on the runner. So this asks GitHub to act.
 */
const GH = 'https://api.github.com';
const keys = () => store.get('keys', {});
const repo = () => store.get('repo', DEFAULT_REPO);

async function gh(path, opts = {}) {
  const t = keys().GITHUB_TOKEN;
  if (!t) throw new Error('No GitHub token — add one under Keys.');
  const r = await fetch(`${GH}/repos/${repo()}${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json',
               'X-GitHub-Api-Version': '2022-11-28',
               ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (r.status === 204) return null;
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.message || `GitHub ${r.status}`);
  return b;
}

const ICON = { success: '✓', failure: '✗', cancelled: '–', in_progress: '◦', queued: '·' };

function viewRun() {
  const runs = el('div');

  const refresh = async () => {
    try {
      const d = await gh('/actions/workflows/gtm.yml/runs?per_page=6');
      const rows = d.workflow_runs || [];
      runs.replaceChildren(
        el('h2', {}, 'Recent runs'),
        rows.length
          ? el('table', {}, el('tbody', {}, ...rows.map(r => el('tr', {},
              el('td', {}, (ICON[r.conclusion || r.status] || '?') + '  ' + new Date(r.created_at).toLocaleString()),
              el('td', {}, r.conclusion || r.status),
              el('td', { style: 'text-align:right' },
                 el('a', { href: r.html_url, target: '_blank', rel: 'noopener' }, 'logs')),
            ))))
          : el('p', { class: 'hint' }, 'No runs yet.'),
      );
    } catch (e) {
      runs.replaceChildren(el('h2', {}, 'Recent runs'), el('p', { class: 'note warn' }, e.message));
    }
  };
  refresh();

  const go = (job, apply, label, cls) => el('button', {
    class: 'b ' + cls,
    onclick: async e => {
      if (apply && !confirm('This run can send real email. Continue?')) return;
      e.target.disabled = true;
      try {
        await gh('/actions/workflows/gtm.yml/dispatches', {
          method: 'POST',
          body: JSON.stringify({ ref: 'main', inputs: {
            job, apply: String(apply), campaign: campaignPath().split('/').pop() } }),
        });
        say(`started ${job}${apply ? ' (live)' : ''}`);
        setTimeout(refresh, 2500);
      } catch (err) { say(err.message, true); }
      finally { e.target.disabled = false; }
    },
  }, label);

  const missing = ['EXPLEE_API_KEY', 'INSTANTLY_API_KEY', 'GITHUB_TOKEN']
    .filter(k => !keys()[k]);

  return [
    el('h2', {}, 'Start a run'),
    el('p', { class: 'hint' },
      `Runs on GitHub against ${campaignPath()} — save first if you have edited anything.`),
    el('div', { class: 'row' },
      go('capacity', false, 'Check capacity', 'go'),
      go('source', false, 'Source & draft', ''),
      go('replies', false, 'Draft replies', ''),
    ),
    el('p', { class: 'note' },
      'Start with capacity — free and read-only. It reports your Explee balance, which ' +
      'mailboxes can actually send, and whether your model provider supports structured ' +
      'output and web search. Sourcing writes drafts; it never sends.'),
    el('div', { class: 'row' }, go('replies', true, 'Send replies (live)', 'risk')),
    missing.length ? el('p', { class: 'note warn' },
      'Not set in this browser: ' + missing.join(', ') + '. Open Keys.') : null,

    el('h2', {}, 'Run it in n8n instead'),
    el('p', { class: 'hint' },
      'Everything on these screens as an importable n8n workflow — the search, the ' +
      'prompt with your offer and ICP in it, and the push to Instantly. Import with ' +
      '⋯ → Import from File.'),
    el('div', { class: 'row' },
      el('button', { class: 'b go', onclick: () => downloadN8n(true) }, 'Download n8n workflow'),
      el('button', { class: 'b', onclick: () => downloadN8n(false) }, 'without keys'),
    ),
    el('p', { class: 'note warn' },
      'The first one embeds your Explee, Instantly and OpenRouter keys in the file so ' +
      'it runs on import. Keep it off shared drives and out of git. The second leaves ' +
      'placeholders in the Config node for you to fill in n8n.'),

    el('h2', {}, 'Instantly campaign'),
    el('p', { class: 'hint' },
      'Leave empty and the first send creates one, paused, and writes its id back. Arming is separate.'),
    text(D.campaign, 'instantly_campaign_id', 'Campaign ID'),

    el('h2', {}, 'Repository'),
    (() => { const i = el('input', { type: 'text' }); i.value = repo();
      i.addEventListener('change', () => { store.set('repo', i.value.trim()); refresh(); });
      return i; })(),

    runs,
  ];
}

/* ------------------------------------------------------------------- keys */
const KEYS = [
  ['EXPLEE_API_KEY', 'Explee', 'lead search and enrichment'],
  ['LINKFINDER_API_KEY', 'LinkFinder AI', 'email resolution'],
  ['INSTANTLY_API_KEY', 'Instantly', 'sending'],
  ['OPENROUTER_API_KEY', 'OpenRouter', 'the qualifier and copywriter'],
  ['GITHUB_TOKEN', 'GitHub', 'PAT with Contents + Actions read & write — saves the campaign and starts runs'],
];

$('#keysLink').onclick = () => {
  const saved = keys();
  const f = {};
  const body = el('div');
  for (const [id, label, hint] of KEYS) {
    f[id] = el('input', { type: 'password', id: 'k-' + id, value: saved[id] || '', autocomplete: 'off' });
    body.append(el('label', {}, label, el('span', { style: 'font-weight:400' }, ' · ' + hint)), f[id]);
  }
  const model = el('input', { type: 'text', value: saved.LLM_MODEL || '',
                              placeholder: 'anthropic/claude-opus-4.5' });
  const resolver = el('select', {}, ...[
    ['linkfinder', 'LinkFinder — ours, no marginal cost'],
    ['explee_premium', 'Explee premium — ~$0.05 per found email, ~78%'],
    ['explee_basic', 'Explee basic — ~$0.015 per found email, ~50%'],
  ].map(([v, t]) => el('option', { value: v, selected: (saved.resolver || 'linkfinder') === v }, t)));

  const cmds = () => KEYS.filter(([id]) => f[id].value)
    .map(([id]) => `gh secret set ${id} --body "${f[id].value}"`)
    .concat(model.value.trim() ? [`gh variable set LLM_MODEL --body "${model.value.trim()}"`] : [])
    .join('\n');

  body.append(
    el('label', {}, 'Model'), model,
    el('label', {}, 'Find emails with'), resolver,
    el('p', { class: 'note warn' },
      'These stay in this browser — that is what keeps them safe, and why the agent ' +
      'cannot read them. It runs on GitHub and needs its own copies.'),
    el('div', { class: 'row' },
      el('button', { class: 'b', onclick: async e => {
        const t = cmds();
        if (!t) return say('fill a key first', true);
        try { await navigator.clipboard.writeText(t); e.target.textContent = 'Copied';
              setTimeout(() => { e.target.textContent = 'Copy gh commands'; }, 1800); }
        catch { say('clipboard blocked — use Download instead', true); }
      } }, 'Copy gh commands'),
      el('button', { class: 'b', onclick: () => {
        const lines = KEYS.filter(([id]) => f[id].value).map(([id]) => `${id}=${f[id].value}`);
        if (model.value.trim()) lines.push(`LLM_MODEL=${model.value.trim()}`);
        if (!lines.length) return say('fill a key first', true);
        download('secrets.env', lines.join('\n') + '\n', 'text/plain');
        say('secrets.env downloaded — it is gitignored');
      } }, 'Download secrets.env'),
    ),
  );

  openDialog('API keys', 'Saved in this browser only.', body, () => {
    const out = { resolver: resolver.value };
    if (model.value.trim()) out.LLM_MODEL = model.value.trim();
    for (const [id] of KEYS) { const v = f[id].value.trim(); if (v) out[id] = v; }
    store.set('keys', out);
    say(`${KEYS.filter(([id]) => out[id]).length} of ${KEYS.length} keys saved`);
    if (view === 'run') render();
  });
};

function openDialog(title, sub, body, onOk) {
  $('#dlgTitle').textContent = title;
  $('#dlgSub').textContent = sub;
  $('#dlgBody').replaceChildren(body);
  $('#dlg').showModal();
  $('#dlgOk').onclick = () => { onOk(); $('#dlg').close(); };
}
$('#dlgCancel').onclick = () => $('#dlg').close();

/* ---------------------------------------------------------------- n8n
 * Everything on these screens, rendered as an importable n8n workflow: the
 * search, the prompt with your offer and ICP in it, and the push to Instantly.
 * Import it in n8n (⋯ → Import from File) and it runs there — no Python, no
 * Actions, and every step visible and editable as a node.
 *
 * Five node types only — manualTrigger, code, httpRequest, wait, if — because
 * a workflow that fails to import is worse than one with an extra Code node.
 * Anything that could have been splitOut or a Set is a Code node instead.
 */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'n-' + Math.random().toString(36).slice(2) + Date.now());

function n8nWorkflow({ withKeys = true } = {}) {
  const k = keys();
  const c = D.campaign, pr = D.project;
  const first = head('first_email');

  const cfg = {
    explee_key: withKeys ? (k.EXPLEE_API_KEY || '') : 'PUT_EXPLEE_KEY_HERE',
    instantly_key: withKeys ? (k.INSTANTLY_API_KEY || '') : 'PUT_INSTANTLY_KEY_HERE',
    openrouter_key: withKeys ? (k.OPENROUTER_API_KEY || '') : 'PUT_OPENROUTER_KEY_HERE',
    model: k.LLM_MODEL || 'anthropic/claude-opus-5',
    instantly_campaign_id: c.instantly_campaign_id || 'PUT_INSTANTLY_CAMPAIGN_ID_HERE',
    limit: 10,
    preset: 'premium',
    job_titles: (c.target_role || '').split(',').map(t => t.trim()).filter(Boolean),
    definition: [ (c.keywords || []).join(', ') || c.customer_problem || c.offer,
                  c.target_geography ? 'in ' + c.target_geography : '' ]
                .filter(Boolean).join(' '),
    criteria: [...(c.positive_criteria || []),
               ...(c.negative_criteria || []).map(x => 'is NOT: ' + x)].slice(0, 5),
    offer: c.offer, problem: c.customer_problem, facts: pr.facts,
    instructions: first.instructions || '', language: first.language || 'lead',
  };

  const CRAFT = [
    'You write one cold email to one person. Four moves, nothing else:',
    '1. An observation — one concrete thing about them or their company, from the lead record. Not a compliment, not "I came across your profile".',
    '2. The consequence — why that likely creates the problem the offer addresses.',
    '3. What you do — concrete and operational, in the order it happens.',
    '4. One ask — a question they can answer in a line. Ask for a reply, not a call.',
    '',
    'Under 90 words. Write in the language of their country; if unclear, English. Write it as a native speaker writes business email, not translated English.',
    '',
    'You may state as fact only what is in THE OFFER and THE FACTS. You may refer to the lead record as something you noticed. Never invent metrics, clients, mutual connections or events. If the record is thin, write a shorter email.',
    '',
    'Never: "I hope this finds you well", "I wanted to reach out", "I came across", "Quick question", "simply", "just", "easily", "leverage", "solution". No compliments on their website. No second ask, no P.S.',
    '',
    'Subject: lowercase, four words or fewer, looks like a person wrote it.',
    '',
    'Reply with JSON only: {"subject": "...", "body": "..."}',
  ].join('\n');

  const node = (name, type, typeVersion, parameters, pos) =>
    ({ parameters, id: uid(), name, type: 'n8n-nodes-base.' + type, typeVersion, position: pos });

  const jsCode = code => ({ jsCode: code });

  const nodes = [
    node('Start', 'manualTrigger', 1, {}, [-40, 300]),

    node('Config', 'code', 2, jsCode(
      '// Everything from the console. Edit here and the whole flow follows.\n' +
      'return [{ json: ' + JSON.stringify(cfg, null, 2).replace(/\n/g, '\n') + ' }];'
    ), [180, 300]),

    node('Explee: find and enrich', 'httpRequest', 4.2, {
      method: 'POST',
      url: 'https://api.explee.com/public/api/v1/find-and-enrich',
      sendHeaders: true,
      headerParameters: { parameters: [
        { name: 'X-API-Key', value: '={{ $json.explee_key }}' }] },
      sendBody: true,
      specifyBody: 'json',
      jsonBody: '={{ JSON.stringify({ people_filters: { job_titles: $json.job_titles, criteria: $json.criteria }, company_filters: { definition: $json.definition }, max_contacts: $json.limit, preset: $json.preset }) }}',
      options: {},
    }, [400, 300]),

    node('Wait', 'wait', 1.1, { amount: 15, unit: 'seconds' }, [620, 300]),

    node('Explee: check job', 'httpRequest', 4.2, {
      method: 'GET',
      url: "={{ 'https://api.explee.com/public/api/v1/find-and-enrich/' + $('Explee: find and enrich').first().json.task_id }}",
      sendHeaders: true,
      headerParameters: { parameters: [
        { name: 'X-API-Key', value: "={{ $('Config').first().json.explee_key }}" }] },
      options: {},
    }, [840, 300]),

    node('Ready?', 'code', 2, jsCode(
      "// What we actually need is contacts, not a status string. Explee reports\n" +
      "// pending with progress_pct 99 and eta 0 for a while before the array is\n" +
      "// populated, so gating on status === 'completed' can spin a long time.\n" +
      '//\n' +
      '// $runIndex is this node\'s iteration inside the loop, which is the only\n' +
      '// exit a Wait/If loop has. Without it a job that never finishes polls\n' +
      '// forever.\n' +
      'const j = $input.first().json;\n' +
      'const meta = j.meta || {};\n' +
      "if (meta.status === 'failed') {\n" +
      "  throw new Error('Explee job failed: ' + (meta.error || 'no reason given'));\n" +
      '}\n' +
      'const contacts = j.contacts;\n' +
      'const ready = Array.isArray(contacts);\n' +
      'if (!ready && $runIndex >= 40) {\n' +
      '  const p = meta.progress || {};\n' +
      "  throw new Error('Still pending after ~10 minutes. Last progress: ' +\n" +
      '    JSON.stringify(p) + \'. The task id is \' +\n' +
      "    $('Explee: find and enrich').first().json.task_id +\n" +
      "    ' — check it in Explee before re-running, the credits are already held.');\n" +
      '}\n' +
      'return [{ json: { ...j, ready } }];'
    ), [1060, 300]),

    node('Done?', 'if', 2, {
      conditions: {
        options: { caseSensitive: true, leftValue: '', typeValidation: 'loose', version: 2 },
        conditions: [{
          id: uid(),
          leftValue: '={{ $json.ready }}',
          rightValue: true,
          operator: { type: 'boolean', operation: 'true', singleValue: true },
        }],
        combinator: 'and',
      },
      options: {},
    }, [1280, 300]),

    node('One item per lead', 'code', 2, jsCode(
      '// Explee returns one item holding every contact. Fan them out, and drop\n' +
      '// anyone without an address — there is nothing to send to.\n' +
      'const contacts = $input.first().json.contacts || [];\n' +
      'return contacts.filter(c => c.email).map(c => ({ json: c }));'
    ), [1500, 200]),

    node('Write the email', 'httpRequest', 4.2, {
      method: 'POST',
      url: 'https://openrouter.ai/api/v1/chat/completions',
      sendHeaders: true,
      headerParameters: { parameters: [
        { name: 'Authorization', value: "={{ 'Bearer ' + $('Config').first().json.openrouter_key }}" },
        { name: 'Content-Type', value: 'application/json' }] },
      sendBody: true,
      specifyBody: 'json',
      jsonBody: "={{ JSON.stringify({ model: $('Config').first().json.model, messages: [ { role: 'system', content: " + JSON.stringify(CRAFT) + " }, { role: 'user', content: 'THE OFFER (the only facts you may assert)\\n' + $('Config').first().json.offer + '\\n\\nTHE FACTS\\n' + $('Config').first().json.facts + '\\n\\nTHE PROBLEM THEY LIKELY HAVE\\n' + $('Config').first().json.problem + '\\n\\nEXTRA INSTRUCTIONS\\n' + $('Config').first().json.instructions + '\\n\\nLEAD RECORD\\n' + JSON.stringify($json) } ] }) }}",
      options: {},
    }, [1720, 200]),

    node('Build the lead', 'code', 2, jsCode(
      "// Parse the model's JSON and shape one Instantly lead. The per-lead copy\n" +
      '// rides as custom variables, so one campaign sends a different email to\n' +
      '// everyone in it.\n' +
      'const out = [];\n' +
      'for (let i = 0; i < $input.all().length; i++) {\n' +
      '  const reply = $input.all()[i].json;\n' +
      "  const lead = $('One item per lead').all()[i].json;\n" +
      "  let text = reply.choices?.[0]?.message?.content ?? '';\n" +
      "  if (text.startsWith('```')) text = text.split('```')[1].replace(/^json/, '').trim();\n" +
      '  let email;\n' +
      '  try { email = JSON.parse(text); }\n' +
      "  catch (e) { continue; }   // model did not return JSON — skip, do not send junk\n" +
      "  const full = lead.full_name || lead.name || '';\n" +
      '  out.push({ json: {\n' +
      '    email: lead.email,\n' +
      "    first_name: lead.first_name || full.split(' ')[0] || '',\n" +
      "    last_name: full.split(' ').slice(1).join(' '),\n" +
      "    company_name: lead.company_name || lead.company || '',\n" +
      '    custom_variables: {\n' +
      '      subject: email.subject,\n' +
      "      body: String(email.body).replace(/\\r\\n/g, '\\n').replace(/\\n/g, '<br>'),\n" +
      '    },\n' +
      '  } });\n' +
      '}\n' +
      'return out;'
    ), [1940, 200]),

    node('Instantly: add leads', 'httpRequest', 4.2, {
      method: 'POST',
      url: 'https://api.instantly.ai/api/v2/leads/list',
      sendHeaders: true,
      headerParameters: { parameters: [
        { name: 'Authorization', value: "={{ 'Bearer ' + $('Config').first().json.instantly_key }}" },
        { name: 'Content-Type', value: 'application/json' }] },
      sendBody: true,
      specifyBody: 'json',
      jsonBody: "={{ JSON.stringify({ campaign_id: $('Config').first().json.instantly_campaign_id, skip_if_in_campaign: true, skip_if_in_workspace: true, leads: $input.all().map(i => i.json) }) }}",
      options: {},
    }, [2160, 200]),
  ];

  const link = (from, to, out = 0) => ({ [from]: { main: [] } });
  const connections = {
    Start: { main: [[{ node: 'Config', type: 'main', index: 0 }]] },
    Config: { main: [[{ node: 'Explee: find and enrich', type: 'main', index: 0 }]] },
    'Explee: find and enrich': { main: [[{ node: 'Wait', type: 'main', index: 0 }]] },
    Wait: { main: [[{ node: 'Explee: check job', type: 'main', index: 0 }]] },
    'Explee: check job': { main: [[{ node: 'Ready?', type: 'main', index: 0 }]] },
    'Ready?': { main: [[{ node: 'Done?', type: 'main', index: 0 }]] },
    // true -> carry on; false -> back to Wait, which is the polling loop.
    'Done?': { main: [
      [{ node: 'One item per lead', type: 'main', index: 0 }],
      [{ node: 'Wait', type: 'main', index: 0 }],
    ] },
    'One item per lead': { main: [[{ node: 'Write the email', type: 'main', index: 0 }]] },
    'Write the email': { main: [[{ node: 'Build the lead', type: 'main', index: 0 }]] },
    'Build the lead': { main: [[{ node: 'Instantly: add leads', type: 'main', index: 0 }]] },
  };

  return {
    name: (c.name || 'GTM') + ' — Explee to Instantly',
    nodes, connections,
    settings: { executionOrder: 'v1' },
    pinData: {},
  };
}

function downloadN8n(withKeys) {
  const wf = n8nWorkflow({ withKeys });
  const name = (D.campaign.name || 'gtm').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.n8n.json';
  download(name, JSON.stringify(wf, null, 2), 'application/json');
  say(withKeys ? `${name} — contains your API keys, keep it local`
                : `${name} — keys left as placeholders`);
}

/* ------------------------------------------------------------ save to repo
 * GitHub is the backend. The console PUTs campaigns/<slug>.json through the
 * contents API and the workflow reads it from the checkout — so editing here
 * and running there is one loop, with no file passing through your downloads
 * folder and no server of our own.
 *
 * Needs the PAT to carry Contents: read and write as well as Actions.
 */
const b64 = str => {
  // btoa is latin-1 only; campaign copy is not.
  const bytes = new TextEncoder().encode(str);
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
};

const campaignPath = () =>
  'campaigns/' + ((D.campaign.name || 'campaign').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) + '.json';

async function saveToRepo(btn) {
  const path = campaignPath();
  const body = JSON.stringify(exportShape(), null, 2) + '\n';
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    // An update needs the blob sha; a create must not send one.
    let sha;
    try {
      const cur = await gh(`/contents/${path}?ref=main`);
      sha = cur?.sha;
    } catch (e) {
      if (!/404|not found/i.test(e.message)) throw e;
    }
    await gh(`/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({
        message: `Update ${path} from the console`,
        content: b64(body), branch: 'main', ...(sha ? { sha } : {}),
      }),
    });
    store.set('campaign_path', path);
    say(`saved ${path} to ${repo()}`);
  } catch (e) {
    say(e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

/* --------------------------------------------------------------- download */
function download(name, text, type) {
  const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}

// The shape run.py load_config() already reads.
function exportShape() {
  return {
    project: { ...D.project },
    campaign: { ...D.campaign },
    prompts: STAGES.map(([s]) => {
      const h = head(s);
      return { stage: s, instructions: h.instructions || '', language: h.language || 'lead',
               follow_up_every_days: h.follow_up_every_days ?? 3,
               max_follow_ups: h.max_follow_ups ?? 2 };
    }),
  };
}

function exportJson() {
  const name = campaignPath().split('/').pop();
  download(name, JSON.stringify(exportShape(), null, 2), 'application/json');
  say(`downloaded ${name}`);
}

/* ------------------------------------------------------------------ render */
function render() {
  store.set('view', view);
  document.querySelectorAll('nav button[data-v]').forEach(b => {
    b.classList.toggle('on', b.dataset.v === view);
  });
  const body = { campaign: viewCampaign, emails: viewEmails, run: viewRun }[view]();
  $('#main').replaceChildren(...body.filter(Boolean),
    el('div', { class: 'row', style: 'margin-top:44px;padding-top:20px;border-top:1px solid var(--line)' },
      el('button', { class: 'b go', onclick: e => saveToRepo(e.target) }, 'Save'),
      el('button', { class: 'b', onclick: exportJson, title: 'download a copy instead' }, 'Download'),
      el('span', { class: 'hint', style: 'margin:0' },
         keys().GITHUB_TOKEN ? `commits ${campaignPath()}` : 'add a GitHub token under Keys to save'),
      el('span', { style: 'flex:1' }),
      el('button', { class: 'b', title: 'light / dark', onclick: () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next); store.set('theme', next);
      } }, '◐'),
    ));
}

document.querySelectorAll('nav button[data-v]').forEach(b => {
  b.onclick = () => { view = b.dataset.v; render(); };
});
if (store.get('theme')) document.documentElement.setAttribute('data-theme', store.get('theme'));
render();
</script>
