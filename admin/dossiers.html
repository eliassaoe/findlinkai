<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dossiers · Admin Urbaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/declaration-prealable/urbaa.css">
<style>
.tabs{display:flex;gap:6px;margin:0 0 16px}
.tab{background:none;border:0;font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--soft);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 18px}
.stat{background:var(--soft);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumbs a{display:block;text-decoration:none;font-size:13px;color:var(--muted)}
.thumbs img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:4px}
.thumbs .doc{height:110px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:26px;margin-bottom:4px}
.flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <a class="logo" href="/admin/dossiers">Urbaa <span class="muted" style="font-weight:500">· admin</span></a>
    <button class="link" id="logout" style="background:none;border:0;cursor:pointer;font:inherit" hidden>Se déconnecter</button>
  </header>

  <section id="login" hidden style="max-width:380px;margin:60px auto">
    <h1 style="font-size:28px">Espace gérant</h1>
    <p class="muted">Entrez le mot de passe admin.</p>
    <form id="loginForm">
      <label class="f">Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" style="width:100%">Se connecter</button>
      <p class="err" id="loginMsg"></p>
    </form>
  </section>

  <section id="list" hidden>
    <div class="stats" id="stats"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div class="tabs"><button class="tab on" data-tab="orders">Commandes</button><button class="tab" data-tab="clients">Contacts</button></div>
      <select id="filter" style="width:auto"><option value="">Tous les statuts</option></select>
    </div>
    <div class="tbl" id="ordersTbl"><table><thead><tr><th>Date</th><th>Entreprise</th><th>Dossier</th><th>Statut</th><th>Photos</th><th>Montant</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="tbl" id="clientsTbl" hidden><table><thead><tr><th>Dernière visite</th><th>Email</th><th>Nom</th><th>Entreprise</th><th>Téléphone</th><th>Offre lancée</th></tr></thead><tbody id="crows"></tbody></table></div>
  </section>

  <section id="detail" hidden>
    <p><a href="#" id="back" class="link">← Tous les dossiers</a></p>
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div><h1 id="dTitle" style="font-size:30px;margin:0"></h1><p class="muted" id="dSub" style="margin:4px 0 0"></p></div>
      <div class="row"><button class="btn" id="copy">Copier pour Claude</button><a class="btn2" id="dSuivi" target="_blank" rel="noopener">Page client</a></div>
    </div>
    <div class="grid2" style="margin-top:18px">
      <div>
        <div class="card"><h2>Photos et fichiers</h2><div class="thumbs" id="dFiles"></div></div>
        <div class="card"><h2>Commande</h2><dl class="kv" id="dFields"></dl></div>
      </div>
      <div>
        <div class="card">
          <h2>Suivi</h2>
          <label class="f">Statut<select id="dStatus"></select></label>
          <label class="f">Notes internes<textarea id="dNotes"></textarea></label>
          <button class="btn" id="save" style="width:100%">Enregistrer</button>
        </div>
        <div class="card"><h2>Contact</h2><dl class="kv" id="dContact"></dl></div>
      </div>
    </div>
  </section>
</div>
<div class="flash" id="flash" hidden></div>
<script src="/admin/dossiers.js"></script>
</body>
</html>
