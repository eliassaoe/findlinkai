}

  const m=$('#settings'); const t=ghToken(); const k=ekey(); const cors=store.get(LS.cors);
  const newTok = 'https://github.com/settings/personal-access-tokens/new?name=Relance%20linkfinderai&description=Bouton%20Envoyer%20de%20%2Frelance&target_name=eliassaoe&expires_in=366&actions=write';
  m.innerHTML = `<div class="lockcard"><h1 style="margin-top:0">Envoi en un clic</h1>
    <p>Les emails partent depuis GitHub, qui détient déjà votre clé Explee. Il faut un jeton GitHub, une seule fois, gardé dans ce navigateur.</p>
    <ol class="note" style="padding-left:18px;margin:0 0 12px;line-height:1.7">
      <li><a href="${newTok}" target="_blank" rel="noopener">Créer le jeton ↗</a></li>
      <li>Repository access → <b>Only select repositories</b> → <b>findlinkai</b></li>
      <li>Permissions → <b>Actions : Read and write</b> → Generate token</li>
      <li>Collez-le ici</li></ol>
    <input class="field" type="password" id="ght" placeholder="github_pat_…" value="${t?'••••••••••••':''}">
    <div class="actions"><button class="btn primary" id="ghs">Enregistrer</button>${t?'<button class="btn" id="ght2">Tester</button><button class="btn ghost" id="ghd">Retirer</button>':''}<button class="btn ghost" id="ekc">Fermer</button></div>
    <details style="margin-top:16px"><summary class="note" style="cursor:pointer">Avancé : envoyer directement par l'API Explee</summary>
      ${cors==='blocked'?'<div class="warn" style="margin-top:8px">Explee a refusé l\'appel depuis le navigateur (CORS) : utilisez le jeton GitHub.</div>':''}
      <input class="field" style="margin-top:8px" type="password" id="ek" placeholder="Clé API Explee" value="${k?'••••••••••••':''}">
      <div class="actions"><button class="btn sm" id="eks">Enregistrer la clé</button>${k?'<button class="btn sm" id="ekt">Tester</button><button class="btn sm ghost" id="ekd">Retirer</button>':''}</div></details>
    <p class="note" style="margin-top:14px">Sans rien activer, tout marche quand même : la page copie le texte et ouvre l'inbox Explee.${S.pw?' · <a href="#" id="lockme">Verrouiller la page</a>':''}</p></div>`;
  m.classList.add('on');
  const close=()=>{ m.classList.remove('on'); shell(); render(); };
  $('#ekc').onclick=()=>m.classList.remove('on');
  $('#ghs').onclick=()=>{ const v=$('#ght').value.trim(); if(v && !v.startsWith('•')) store.set(LS.gh,v); close(); toast('Envoi en un clic activé sur cet appareil'); };
  if($('#ghd')) $('#ghd').onclick=()=>{ store.set(LS.gh,null); close(); };
  if($('#ght2')) $('#ght2').onclick=async()=>{ try{ await gh('GET',`/repos/${GH_REPO}/actions/workflows/${GH_WF}`); toast('Jeton GitHub OK ✓'); }catch(e){ toast(e.message,true); } };
  $('#eks').onclick=()=>{ const v=$('#ek').value.trim(); if(v && !v.startsWith('•')){ store.set(LS.key,v); store.set(LS.cors,null); } close(); };
  if($('#ekd')) $('#ekd').onclick=()=>{ store.set(LS.key,null); close(); };
  if($('#ekt')) $('#ekt').onclick=async()=>{ try{ const b=await api('GET','/billing/balance'); toast(`Explee connecté ✓ · solde ${b.remain} crédits`, (b.remain||0)<=0); }catch(e){ toast(e.message,true); } };
  if($('#lockme')) $('#lockme').onclick=e=>{ e.preventDefault(); store.set(LS.pw,null); location.reload(); };
}

/* ───────── rendu ───────── */
function inScope(l){
  const s=S.scope;
  if(s.type==='project' && String(l.project_id)!==String(s.id)) return false;
  if(s.type==='campaign' && String(l.campaign_id)!==String(s.id)) return false;
  if(S.q){ const q=S.q.toLowerCase(); if(![l.name,l.company,l.email,l.campaign].join(' ').toLowerCase().includes(q)) return false; }
  return true;
}
const isAction = l => ['reply','call','today'].includes(l.bucket) && !S.done[l.key];
const prio = l => ({reply:0,call:1,today:2,scheduled:3,booked:4,finished:5,lost:6,unknown:7})[l.bucket];
const byPrio = (a,b) => (!!S.done[a.key])-(!!S.done[b.key]) || prio(a)-prio(b) || ((a.next||{}).due||'9').localeCompare((b.next||{}).due||'9');
const short = c => String(c||'').replace(/^Prescient\s*[–-]\s*/,'');
function render(){ renderMain(); }

function scopeSelect(){
  const d=S.data; let o=`<option value='{"type":"all"}'>Tous les projets (${d.leads.length})</option>`;
  for(const p of d.projects){
    const pl=d.leads.filter(l=>String(l.project_id)===String(p.id)); if(!pl.length) continue;
    o += `<option value='${esc(JSON.stringify({type:'project',id:p.id}))}'>${esc(p.name)} (${pl.length})</option>`;
    for(const c of d.campaigns.filter(c=>String(c.project_id)===String(p.id))){
      const n=pl.filter(l=>String(l.campaign_id)===String(c.id)).length; if(!n) continue;
      o += `<option value='${esc(JSON.stringify({type:'campaign',id:c.id}))}'>   ${esc(short(c.name))} (${n})</option>`;
    }
  }
  return `<select class="scope" id="scope">${o}</select>`;
}

function renderMain(){
  const d=S.data, leads=d.leads.filter(inScope);
  // « Aujourd'hui » = ce qui demande VOTRE action : pas les emails que recover.py envoie déjà
  const mine = l => !(l.auto && ['reply','today'].includes(l.bucket) && !l.review);
  const emails = leads.filter(l=>['reply','today'].includes(l.bucket) && !S.done[l.key] && mine(l));
  const calls = leads.filter(l=>l.bucket==='call');
  const later = leads.filter(l=>l.bucket==='scheduled').length;
  const ready = emails.map(l=>({l, s:sendable(l)})).filter(x=>x.s);
  let h = d.demo ? `<div class="demo">Données d'exemple : rien n'est envoyé.</div>` : '';
  if((Date.now()-new Date(d.generated_at))/36e5>26) h += `<div class="warn">Dernière synchro ${esc(ago(d.generated_at))}. <a href="${REPO_ACTIONS}" target="_blank" rel="noopener">Actualiser</a></div>`;
  h += `<div class="bar"><span class="summary"><b>${emails.length}</b> email${emails.length>1?'s':''} · <b>${calls.filter(l=>!S.done[l.key]).length}</b> appel${calls.length>1?'s':''} · ${later} plus tard</span>
    <span class="grow"></span>${scopeSelect()}
    ${ready.length?`<button class="btn primary" id="sendall">${mode()==='copy'?'Activer l\'envoi':`Tout envoyer (${ready.length})`}</button>`:''}</div>`;
  const tabs=[['today','Aujourd\'hui',emails.length+calls.filter(l=>!S.done[l.key]).length],['calls','Appels',calls.length],['all','Tout',leads.length]];
  h += `<div class="tabs">${tabs.map(([id,l,c])=>`<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${l}<span class="n">${c}</span></button>`).join('')}<input class="q" id="q" placeholder="Rechercher" value="${esc(S.q)}"></div>`;
  if(S.tab==='calls') h += callList(calls, leads.filter(l=>l.bucket==='scheduled'&&l.next&&l.next.key==='call'&&l.phones.length));
  else if(S.tab==='today'){
    const act = leads.filter(l=>['reply','call','today'].includes(l.bucket) && mine(l));
    h += act.length ? groups(act,['reply','today','call']) : `<div class="empty">Rien à faire aujourd'hui.</div>`;
  } else h += leads.length ? groups(leads,['reply','today','call','scheduled','booked','finished','lost','unknown']) : `<div class="empty">Aucun lead.</div>`;
  $('#content').innerHTML = h;
  $('#scope').value = JSON.stringify(S.scope.type==='all'?{type:'all'}:S.scope);
  $('#scope').onchange=e=>{ S.scope=JSON.parse(e.target.value); renderMain(); };
  $('#q').oninput=e=>{ S.q=e.target.value.trim(); const pos=e.target.selectionStart; renderMain(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); };
  $('#content').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab; renderMain();});
  $('#content').querySelectorAll('[data-key]').forEach(r=>r.onclick=e=>{ if(e.target.closest('a,button,input')) return; openLead(r.dataset.key);});
  wireActions($('#content'));
}
const SEC = {reply:'À répondre', today:'Relances', call:'Appels', scheduled:'Plus tard', booked:'RDV calés', finished:'Séquence terminée', lost:'Pas intéressés', unknown:'Autres'};
function groups(leads, order){
  let h='';
  for(const b of order){
    const g = leads.filter(l=>l.bucket===b).sort(byPrio); if(!g.length) continue;
    h += `<div class="sec">${SEC[b]}</div>${g.map(row).join('')}`;
  }
  return h;
}
function nextText(l){
  const dn=S.done[l.key];
  if(dn) return `<span class="tag ok">${esc(dn.text)}</span>`;
  if(['booked','lost','finished','unknown'].includes(l.bucket)) return '';
  if(l.bucket==='reply') return 'attend votre réponse';
  const w=when(l.next&&l.next.due);
  return `${esc(l.next?l.next.label:'')} · <span class="${w.c==='late'?'late':''}">${w.t}</span>`;
}
function row(l){
  const sub=[l.company, short(l.campaign)].filter(Boolean).join(' · ');
  return `<div class="row ${S.done[l.key]&&!S.done[l.key].queued?'dim':''}" data-key="${esc(l.key)}">
    <div class="who"><div class="nm">${esc(l.name)}</div><div class="sub">${esc(sub)}</div></div>
    <div class="nx">${nextText(l)}</div><div>${actionCell(l)}</div></div>`;
}
function actionCell(l){
  const dn = S.done[l.key];
  if(dn && dn.queued) return `<button class="btn sm" data-undo="${esc(l.key)}">Annuler</button>`;
  if(dn) return dn.failed ? `<a class="tag" href="${esc(dn.run||REPO_ACTIONS)}" target="_blank" rel="noopener">échec ↗</a>` : '';
  const sd = sendable(l);
  if(sd) return `<button class="btn sm" data-send="${esc(l.key)}" title="${esc(sd.text.slice(0,400))}">Envoyer</button>`;
  if(l.bucket==='call' && l.phones.length) return `<a class="btn sm" href="tel:${esc(l.phones[0].raw)}" data-tel="${esc(l.key)}">Appeler</a>`;
  if(l.bucket==='reply' && l.review) return `<button class="btn sm" data-open="${esc(l.key)}">À relire</button>`;
  if(l.auto && ['today','reply'].includes(l.bucket)) return `<span class="tag" title="Ces emails partent déjà automatiquement (recover.py)">auto</span>`;
  return '';
}
function callList(calls, later){
  let h = calls.length ? callCards(calls) : `<div class="empty">Aucun appel aujourd'hui.</div>`;
  if(later && later.length) h += `<div class="sec">Prochains appels</div>${callCards(later, true)}`;
  return h;
}
function callCards(calls, later){
  return calls.sort(byPrio).map(l=>{ const d=l.drafts, p=l.phones[0], dn=S.done[l.key];
    return `<div class="call" style="${dn?'opacity:.45':''}">
      <div class="top"><div class="who" style="flex:1;min-width:0"><div class="nm">${esc(l.name)}</div><div class="sub">${esc([l.title,l.company].filter(Boolean).join(' · '))}</div></div>
      ${dn?`<span class="tag ok">${esc(dn.text)}</span>`:`${later?`<span class="tag">${esc(when(l.next.due).t)}</span>`:''}<a class="btn ${later?'':'primary'}" href="tel:${esc(p.raw)}">${esc(p.pretty)}</a>`}</div>
      <div class="said">« ${esc(l.last_reply.slice(0,200))} »</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.call)}">Copier</button><b>Script</b>${esc(d.call)}</div>
      <details><summary>Messagerie et SMS</summary>
        <div class="script" style="margin-top:8px"><button class="btn sm ghost copy" data-copytxt="${esc(d.voicemail)}">Copier</button><b>Messagerie</b>${esc(d.voicemail)}</div>
        <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.sms)}">Copier</button><b>SMS</b>${esc(d.sms)}</div></details>
      ${dn?'':`<div class="outs"><button class="btn sm" data-callout="booked" data-k="${esc(l.key)}">RDV calé</button><button class="btn sm" data-callout="voicemail" data-k="${esc(l.key)}">Message laissé</button><button class="btn sm" data-callout="no_answer" data-k="${esc(l.key)}">Pas de réponse</button><button class="btn sm" data-callout="not_interested" data-k="${esc(l.key)}">Pas intéressé</button></div>`}
    </div>`; }).join('');
}
function wireActions(root){
  const L = k => S.data.leads.find(x=>x.key===k);
  root.querySelectorAll('[data-send]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const l=L(b.dataset.send); const sd=sendable(l); if(!sd) return;
    if(mode()==='copy'){ settings(); return toast('Activez l\'envoi en un clic (une seule fois)'); } sendNow(l, sd.step, sd.text); toast(`${STEP[sd.step]} à ${l.name} · annulable ${UNDO_MS/1000} s`); });
  root.querySelectorAll('[data-undo]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); unqueue(b.dataset.undo); });
  root.querySelectorAll('[data-tel]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); });
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openLead(b.dataset.open); });
  root.querySelectorAll('[data-copytxt]').forEach(b=>b.onclick=()=>copyText(b.dataset.copytxt));
  root.querySelectorAll('[data-callout]').forEach(b=>b.onclick=()=>record(L(b.dataset.k), `Appel : ${OUT[b.dataset.callout]}`));
  const sa=root.querySelector('#sendall'); if(sa) sa.onclick=()=>{ if(mode()==='copy') return settings();
    const leads=S.data.leads.filter(inScope).filter(l=>['reply','today'].includes(l.bucket)); sendAll(leads.map(l=>({l, s:sendable(l)})).filter(x=>x.s)); };
}

/* ───────── fiche lead ───────── */
function openLead(key, keepTpl){
  const l = S.data.leads.find(x=>x.key===key); if(!l) return closeLead();
  S.open = key;
  const defTpl = l.bucket==='reply' ? 'reply' : (l.next && l.next.key) || 'email1';
  if(!keepTpl || !S.tpl) S.tpl = defTpl;
  const dn = S.done[l.key];
  const links = [`<a href="${esc(l.inbox_url)}" target="_blank" rel="noopener">Inbox ↗</a>`,
    l.linkedin?`<a href="${esc(l.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`:'',
    `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`,
    ...l.phones.map(p=>`<a href="tel:${esc(p.raw)}">${esc(p.pretty)}</a>`)].filter(Boolean).join('');
  let h = `<div class="dh"><div style="min-width:0"><h2>${esc(l.name)}</h2><div class="sub">${esc([l.title,l.company,short(l.campaign)].filter(Boolean).join(' · '))}</div><div class="links">${links}</div></div><button class="x" id="close" aria-label="Fermer">✕</button></div><div class="db">`;
  if(l.steps.length) h += `<div class="steps">${l.steps.map(s=>{
    const cur = l.next && l.next.key===s.key && !['booked','lost'].includes(l.bucket);
    const cls = s.done?'done':(cur?(s.due&&diff(s.due)<0?'late':'cur'):'');
    const lab = s.key==='call'?'Appel':s.label;
    return `<span class="${cls}" title="${esc(s.done?'fait':('prévu '+dd(s.due)))}">${s.done?'✓ ':''}${lab}${!s.done&&s.due?' · '+esc(cur?when(s.due).t:dd(s.due)):''}</span>`;
  }).join('')}</div>`;
  if(dn) h += `<div class="tag ok" style="margin-bottom:12px">${esc(dn.text)}</div>`;
  const tpls = [['reply','Réponse'],['email1','Email 1'],['email2','Email 2'],['email3','Email 3']];
  if(l.phones.length) tpls.splice(2,0,['call','Appel']);
  h += `<div class="seg">${tpls.map(([k,t])=>`<button data-tpl="${k}" class="${S.tpl===k?'on':''}">${t}</button>`).join('')}</div>`;
  if(S.tpl==='call'){
    const d=l.drafts;
    h += `<div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.call)}">Copier</button><b>Script</b>${esc(d.call)}</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.voicemail)}">Copier</button><b>Messagerie</b>${esc(d.voicemail)}</div>
      <div class="script"><button class="btn sm ghost copy" data-copytxt="${esc(d.sms)}">Copier</button><b>SMS</b>${esc(d.sms)}</div>
      <div class="actions"><a class="btn primary" href="tel:${esc(l.phones[0].raw)}">Appeler ${esc(l.phones[0].pretty)}</a></div>
      <div class="outs"><button class="btn sm" data-out="booked">RDV calé</button><button class="btn sm" data-out="voicemail">Message laissé</button><button class="btn sm" data-out="no_answer">Pas de réponse</button><button class="btn sm" data-out="not_interested">Pas intéressé</button></div>
      <div class="inline note">Rappeler le <input type="date" id="retryAt"> <button class="btn sm" data-out="retry">OK</button></div>`;
  } else {
    const direct = mode()!=='copy' && !l.auto;
    h += `${l.auto?'<div class="note" style="margin-bottom:8px">Ce projet est relancé automatiquement par recover.py.</div>':''}${l.review && S.tpl==='reply'?'<div class="warn" style="margin:0 0 10px">Le lead pose une question : complétez la réponse.</div>':''}<textarea id="draft">${esc(l.drafts[S.tpl]||'')}</textarea>
      <div class="actions">${dn&&dn.queued?`<button class="btn" data-undo="${esc(l.key)}">Annuler l'envoi</button>`:(direct?`<button class="btn primary" id="send">Envoyer</button>`:`<button class="btn primary" id="copyopen">Copier et ouvrir l'inbox</button>`)}<button class="btn ghost" data-copytxt-draft="1">Copier</button></div>`;
  }
  const status = l.bucket==='booked'||l.bucket==='lost'
    ? `<button class="link" data-status="reactivate">Réactiver la séquence</button>`
    : `<button class="link" data-status="booked">RDV calé</button><button class="link" data-status="lost">Pas intéressé</button>`;
  h += `<div class="inline note" style="margin-top:20px;gap:16px">${status}<span>Attendre jusqu'au <input type="date" id="snooze" value="${esc(l.wait_until||'')}"></span></div>`;
  h += `<details><summary>Conversation (${l.thread.length})</summary>${l.thread.map(m=>`<div class="msg ${m.from}"><div class="mh">${m.from==='lead'?esc(l.first_name||l.name):'Vous'} · ${dtFr(m.at)}</div>${esc(m.text||'')}</div>`).join('')}${l.note?`<div class="msg"><div class="mh">Note Explee</div>${esc(l.note)}</div>`:''}</details></div>`;

  const dr=$('#drawer'); dr.innerHTML=h; dr.classList.add('on'); $('#veil').classList.add('on');
  $('#close').onclick=closeLead;
  dr.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{S.tpl=b.dataset.tpl; openLead(key,true);});
  dr.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>callOutcome(l,b.dataset.out));
  dr.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>({booked:()=>record(l,'RDV calé'),lost:()=>record(l,'Pas intéressé'),reactivate:()=>record(l,'Séquence réactivée')})[b.dataset.status]());
  const sz=$('#snooze'); if(sz) sz.onchange=()=>{ if(sz.value) record(l,`Attendre jusqu'au ${sz.value}`); };
  const cd=dr.querySelector('[data-copytxt-draft]'); if(cd) cd.onclick=()=>copyText($('#draft').value);
  const send=$('#send'); if(send) send.onclick=()=>{ const t=$('#draft').value.trim(); if(!t) return toast('Message vide',true); sendNow(l, S.tpl, t); toast(`${STEP[S.tpl]} à ${l.name} · annulable ${UNDO_MS/1000} s`); };
  const co=$('#copyopen'); if(co) co.onclick=async()=>{ await copyText($('#draft').value,true); window.open(l.inbox_url,'_blank','noopener'); toast('Texte copié : collez-le en réponse dans le fil'); markDone(l, `${STEP[S.tpl]} préparé`); };
  wireActions(dr);
}
function closeLead(){ S.open=null; S.tpl=null; $('#drawer').classList.remove('on'); $('#veil').classList.remove('on'); }
$('#veil').onclick=closeLead;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeLead(); $('#settings').classList.remove('on'); } if(e.key==='/' && !['TEXTAREA','INPUT'].includes(document.activeElement.tagName) && $('#q')){ e.preventDefault(); $('#q').focus(); }});

async function copyText(t, quiet){ try{ await navigator.clipboard.writeText(t); if(!quiet) toast('Copié'); }catch{ if(!quiet) toast('Copie impossible',true); } }
function callOutcome(l, o){
  if(o==='retry'){ const v=$('#retryAt').value; if(!v) return toast('Choisissez une date de rappel',true); return record(l,`Appel : à rappeler le ${v}`); }
  return record(l, `Appel : ${OUT[o]}`);
}
function exportCsv(){
  const lab = Object.fromEntries(Object.entries(BUCKET).map(([k,v])=>[k,v.l]));
  const head = ['Statut','Prochaine action','Échéance','Nom','Téléphone','Email','Poste','Entreprise','Site','LinkedIn','Projet','Campagne','Hot depuis','Relances envoyées','Dernier msg de','Jours de silence',"Attendre jusqu'au",'Dernière réponse du lead','Inbox'];
  const q = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = S.data.leads.filter(inScope).sort(byPrio).map(l=>[lab[l.bucket],(l.next||{}).label,(l.next||{}).due,l.name,l.phones.map(p=>p.pretty).join(' | '),l.email,l.title,l.company,l.domain,l.linkedin,l.project,l.campaign,l.hot_since,l.relances_sent,{lead:'Lead',me:'Moi'}[l.last_from]||'',l.days_silent,l.wait_until,l.last_reply,l.inbox_url]);
  const csv = '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`hot_leads_${todayIso()}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ───────── démarrage ───────── */
(async()=>{
  const pw = store.get(LS.pw);
  if(PAGE && PAGE.blob && PAGE.blob.plain){ await open_(null); return; }
  if(PAGE && PAGE.blob && pw){ try{ await open_(pw); return; }catch{ store.set(LS.pw,null); } }
  lockScreen();
})();
</script>
