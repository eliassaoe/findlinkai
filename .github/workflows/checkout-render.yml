name: Render checkout page
# Opens a Dodo checkout URL in a real headless Chromium from a GitHub runner
# (this sandbox cannot reach Dodo) and prints what a customer would see: the
# visible text, whether a card/payment field rendered, payment-method iframes,
# console errors and failed network requests. Enters no card, pays nothing.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Checkout URL to render
        required: true
        type: string
      email:
        description: Email to type into the form if it asks for one (optional)
        required: false
        type: string
        default: ''
      country:
        description: Customer country to simulate (label as shown in the form, e.g. United States, France, India)
        required: false
        type: string
        default: 'United States'
      via_worker_plan:
        description: If set (e.g. payg_small), create the session through the dodo-checkout worker first and render that URL instead
        required: false
        type: string
        default: ''
      worker_token:
        description: user_token for the worker call (only if LF_CANARY_USER_TOKEN secret is not set); fake tokens may be refused
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.47.2 install --with-deps chromium
      - name: Render like a customer
        shell: bash
        env:
          RENDER_URL: ${{ inputs.url }}
          RENDER_EMAIL: ${{ inputs.email }}
          RENDER_COUNTRY: ${{ inputs.country }}
          VIA_WORKER_PLAN: ${{ inputs.via_worker_plan }}
          WORKER_TOKEN: ${{ secrets.LF_CANARY_USER_TOKEN || inputs.worker_token }}
        run: |
          npm init -y >/dev/null 2>&1 && npm i --silent playwright@1.47.2 >/dev/null 2>&1
          cat > render.mjs <<'JS'
          import { chromium } from 'playwright';
          let url = process.env.RENDER_URL; const email = process.env.RENDER_EMAIL || '';
          const countryLabel = process.env.RENDER_COUNTRY || 'United States';
          if (process.env.VIA_WORKER_PLAN) {
            const body = { plan: process.env.VIA_WORKER_PLAN, user_token: process.env.WORKER_TOKEN || 'render_probe_token_000', force_new_session: true,
              request_id: 'render-' + Date.now().toString(36), requested_at: new Date().toISOString(), attribution_source: 'render_probe' };
            if (email) body.email = email;
            const wr = await fetch('https://dodo-checkout.hamoureliasse.workers.dev/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Origin': 'https://linkfinderai.com' }, body: JSON.stringify(body) });
            const wd = await wr.json().catch(() => ({}));
            console.log('worker:', wr.status, JSON.stringify(wd).slice(0, 400));
            if (!wd.checkout_url) { console.log('::error::worker gave no checkout_url; cannot render the worker path'); process.exit(1); }
            url = wd.checkout_url;
          }
          const consoleErrors = [], failedRequests = [], badResponses = [];
          const browser = await chromium.launch();
          const ctx = await browser.newContext({ locale: 'en-US', viewport: { width: 1280, height: 900 },
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36' });
          const page = await ctx.newPage();
          page.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') consoleErrors.push(`[${m.type()}] ${m.text().slice(0, 300)}`); });
          page.on('requestfailed', r => failedRequests.push(`${r.method()} ${r.url().slice(0, 160)} :: ${r.failure()?.errorText}`));
          page.on('response', async r => {
            if (r.status() < 400) return;
            let body = '';
            if (/dodopayments\.(com|tech)/.test(r.url())) { try { body = (await r.text()).slice(0, 600); } catch (_) {} }
            const reqBody = /dodopayments\.com\/api/.test(r.url()) ? (r.request().postData() || '').slice(0, 400) : '';
            badResponses.push(`${r.status()} ${r.request().method()} ${r.url().slice(0, 160)}${reqBody ? '\n    request: ' + reqBody : ''}${body ? '\n    response: ' + body : ''}`);
          });
          console.log('opening', url);
          const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
          console.log('navigation status:', resp && resp.status(), 'final url:', page.url());
          await page.waitForTimeout(8000);
          try { await page.waitForLoadState('networkidle', { timeout: 15000 }); } catch (_) { console.log('(network never went idle within 15s)'); }
          const snapshot = async (label) => {
            const text = await page.evaluate(() => document.body.innerText);
            const inputs = await page.evaluate(() => [...document.querySelectorAll('input,select,button')].map(e => `${e.tagName.toLowerCase()}${e.type ? '[' + e.type + ']' : ''} name=${e.name || '-'} id=${e.id || '-'} placeholder=${e.placeholder || '-'} text=${(e.innerText || e.value || '').trim().slice(0, 40)} disabled=${e.disabled}`));
            const frames = page.frames().map(f => f.url()).filter(u => u && u !== 'about:blank' && u !== page.url());
            console.log(`\n===== ${label}: visible text (${text.length} chars) =====\n${text.replace(/\n[A-Z][^\n]{1,40} \+\d{1,4}(?=\n)/g, '').slice(0, 2500)}`);
            console.log(`\n===== ${label}: form controls (${inputs.length}) =====\n${inputs.map(i => i.replace(/\n[\s\S]*$/, '')).slice(0, 60).join('\n')}`);
            console.log(`\n===== ${label}: iframes (${frames.length}) =====\n${frames.map(u => u.replace(/[?#].*$/, '')).join('\n')}`);
            const cardish = await page.evaluate(() => !!document.querySelector('input[autocomplete*="cc-"],input[name*="card" i],iframe[src*="stripe" i],iframe[src*="adyen" i],iframe[src*="checkout" i],iframe[name*="card" i]'));
            console.log(`\n${label}: card/payment field detected: ${cardish}`);
          };
          await snapshot('initial');
          // Validation messages: anything the page marks as an alert or error.
          const errors = async () => page.evaluate(() => [...document.querySelectorAll('[role="alert"],[aria-invalid="true"],[class*="error" i],[class*="destructive" i],p[id$="-form-item-message"]')]
            .map(e => (e.innerText || e.getAttribute('aria-label') || e.name || '').trim()).filter(Boolean).slice(0, 30));
          if (email) {
            // A field the session pre-filled and locked is reported, not fought.
            const locked = [];
            const fill = async (sel, val) => {
              const l = page.locator(sel).first();
              if (!(await l.count())) return false;
              if (await l.isDisabled() || (await l.getAttribute('readonly')) !== null) { locked.push(`${sel} = "${await l.inputValue().catch(() => '')}"`); return false; }
              await l.fill(val, { timeout: 8000 }); return true;
            };
            const filled = [];
            if (await fill('input[name="fullName"]', 'Probe Customer')) filled.push('fullName');
            if (await fill('input[name="email"], input[type="email"]', email)) filled.push('email');
            // First: what does step 1 demand when a customer gives only name and email?
            {
              const b = page.locator('button#step1, button:has-text("Continue to Payment")').first();
              if (await b.count()) { try { await b.click({ timeout: 4000 }); } catch (_) {} }
              await page.waitForTimeout(2500);
              const req = await page.evaluate(() => [...document.querySelectorAll('input,select')].filter(e => e.required || e.getAttribute('aria-required') === 'true' || e.getAttribute('aria-invalid') === 'true').map(e => `${e.name || e.placeholder || e.tagName} invalid=${e.getAttribute('aria-invalid')}`));
              console.log('\nSTEP 1 with name+email only -> still on step 1:', /step1|Continue to Payment/.test(await page.evaluate(() => document.body.innerHTML)), '| required/invalid fields:', JSON.stringify(req));
              console.log('validation messages:', JSON.stringify(await errors()));
            }
            const country = page.locator('select[name="country"]').first();
            if (await country.count()) { if (await country.isDisabled()) { locked.push('select[name="country"] = "' + await country.inputValue().catch(() => '') + '"'); } else { try { await country.selectOption({ label: countryLabel }, { timeout: 8000 }); filled.push('country=' + countryLabel); } catch (e) { console.log('country select failed:', e.message.slice(0, 100)); } } }
            await page.waitForTimeout(1000);
            const manual = page.locator('button:has-text("Enter address manually")').first();
            if (await manual.count()) { try { await manual.click({ timeout: 3000 }); filled.push('manual-address'); } catch (_) {} }
            const addr = countryLabel === 'France' ? ['10 rue de Rivoli', 'Paris', '75001', 'Île-de-France'] : countryLabel === 'India' ? ['12 MG Road', 'Bengaluru', '560001', 'Karnataka'] : ['1 Market St', 'San Francisco', '94105', 'CA'];
            if (await fill('input[name="addressLine"]', addr[0])) filled.push('addressLine');
            if (await fill('input[name="city"]', addr[1])) filled.push('city');
            if (await fill('input[name="zipCode"]', addr[2])) filled.push('zipCode');
            if (await fill('input[name="state"]', addr[3])) filled.push('state');
            if (await fill('input[type="tel"]', countryLabel === 'France' ? '+33 6 12 34 56 78' : '+1 415 555 0134')) filled.push('phone');
            const cb = page.locator('input[type="checkbox"]').first();
            if (await cb.count()) { try { if (!(await cb.isChecked())) await cb.check({ force: true }); filled.push('checkbox'); } catch (e) { console.log('checkbox:', e.message.slice(0, 80)); } }
            console.log('\nfilled step 1:', filled.join(', '));
            console.log('locked (disabled/readonly) fields:', locked.length ? locked.join(' | ') : '(none)');
            const disabledAll = await page.evaluate(() => [...document.querySelectorAll('input,select,button')].filter(e => e.disabled).map(e => `${e.tagName.toLowerCase()} ${e.name || e.id || e.placeholder || (e.innerText || '').trim().slice(0, 30)}`));
            console.log('all disabled controls on step 1:', JSON.stringify(disabledAll));
            console.log('validation before submit:', JSON.stringify(await errors()));
            const next = page.locator('button#step1, button:has-text("Continue to Payment"), button[type="submit"]').first();
            if (await next.count()) { try { await next.click({ timeout: 5000 }); console.log('clicked:', (await next.innerText()).trim()); } catch (e) { console.log('could not click continue:', e.message.slice(0, 120)); } }
            await page.waitForTimeout(10000);
            console.log('validation after submit:', JSON.stringify(await errors()));
            console.log('url after submit:', page.url());
            await snapshot('after submit');
            // Is there a card number field now, in the page or in any iframe?
            let cardInputs = [];
            for (const f of page.frames()) { try { cardInputs.push(...await f.evaluate(() => [...document.querySelectorAll('input')].map(i => `${location.hostname}: ${i.name || i.id || i.placeholder || i.autocomplete || 'input'}`))); } catch (_) {} }
            console.log(`\n===== inputs across all frames after submit (${cardInputs.length}) =====\n${cardInputs.slice(0, 40).join('\n')}`);
            // Type a card (never submitted) to see whether Pay now ever enables.
            const payBtn = page.locator('button#submit, button:has-text("Pay now")').first();
            const payState = async () => (await payBtn.count()) ? `disabled=${await payBtn.isDisabled()} text=${(await payBtn.innerText()).trim()}` : 'no pay button';
            console.log('pay button before card:', await payState());
            const sdk = page.frames().find(f => /sdk-v2\.hs\.dodopayments\.com/.test(f.url()));
            if (sdk) {
              const typeIn = async (ph, val) => { const l = sdk.locator(`input[placeholder="${ph}"]`).first(); if (await l.count()) { await l.click(); await l.pressSequentially(val, { delay: 40 }); return true; } return false; };
              const ok1 = await typeIn('1234 1234 1234 1234', '4242424242424242');
              const ok2 = await typeIn('MM / YY', '1234');
              const ok3 = await typeIn('CVC', '123');
              console.log('typed card:', ok1, ok2, ok3);
              await page.waitForTimeout(4000);
              console.log('pay button after card:', await payState());
              const sdkText = await sdk.evaluate(() => document.body.innerText).catch(() => '');
              console.log('payment frame text:', sdkText.replace(/\s+/g, ' ').slice(0, 400));
              const pageText = await page.evaluate(() => document.body.innerText);
              console.log('page text after card:', pageText.replace(/\s+/g, ' ').slice(0, 500));
            } else { console.log('payment SDK frame not found'); }
          }
          console.log(`\n===== console errors/warnings (${consoleErrors.length}) =====\n${consoleErrors.slice(0, 40).join('\n')}`);
          console.log(`\n===== failed requests (${failedRequests.length}) =====\n${failedRequests.slice(0, 40).join('\n')}`);
          console.log(`\n===== HTTP 4xx/5xx responses (${badResponses.length}) =====\n${badResponses.slice(0, 40).join('\n')}`);
          await browser.close();
          JS
          node render.mjs
