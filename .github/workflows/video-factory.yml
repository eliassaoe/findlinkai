name: Video factory

# Builds tutorial videos from video_factory/scenarios/*.json (real app UI,
# real lookup values, neural narration) and attaches each MP4 (+ meta, thumbnail)
# to the "video-factory" release. See video_factory/README.md.
# Scenarios without an MP4 in any video-factory* release are split into shards of
# SHARD and built in parallel (one runner per shard).
# GitHub caps a release at 1000 assets (3 per video), so "video-factory" is full:
# a scenario uploads to its "release" field, default "video-factory-2". Generators
# give new batches their own release (about 300 videos each). The MP4 URL is
# https://github.com/eliassaoe/findlinkai/releases/download/<release>/<slug>.mp4
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated scenario slugs; empty = every scenario without an MP4 in the release"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "video_factory/scenarios/**"

permissions:
  contents: write

concurrency:
  group: video-factory
  cancel-in-progress: false

env:
  SHARD: "12"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      any: ${{ steps.p.outputs.any }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release
        run: gh release view video-factory >/dev/null 2>&1 || gh release create video-factory --title "Video factory" --notes "MP4s built by .github/workflows/video-factory.yml" --prerelease
      - id: p
        run: |
          have=""
          for r in $(gh release list -L 50 --json tagName -q '.[].tagName' | grep '^video-factory'); do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$r" -q .id)
            for p in $(seq 1 12); do
              page=$(gh api "repos/${{ github.repository }}/releases/$id/assets?per_page=100&page=$p" -q '.[].name' || true)
              [ -z "$page" ] && break
              have="$have
          $page"
            done
          done
          have=$(echo "$have" | sed 's/^ *//')
          slugs="${{ github.event.inputs.slugs }}"
          if [ -z "$slugs" ]; then
            for f in video_factory/scenarios/*.json; do
              s=$(basename "$f" .json)
              echo "$have" | grep -qx "$s.mp4" || slugs="$slugs $s"
            done
          fi
          python3 - "$slugs" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          s = sys.argv[1].split(); n = int(os.environ["SHARD"])
          shards = [" ".join(s[i:i + n]) for i in range(0, len(s), n)]
          print("shards=" + json.dumps(shards)); print("any=" + ("true" if s else "false"))
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slugs: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          pip install "edge-tts>=7.0.2" piper-tts
      - name: Build
        run: |
          mkdir -p out checks
          for s in ${{ matrix.slugs }}; do
            rel=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('release') or 'video-factory-2')" "video_factory/scenarios/$s.json")
            gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --title "Video factory ($rel)" --notes "MP4s built by .github/workflows/video-factory.yml" --prerelease || true
            if python3 video_factory/build.py "video_factory/scenarios/$s.json" "out/$s"; then
              cp "out/$s/meta.json" "out/$s/$s.meta.json"
              for i in 1 2 3 4; do gh release upload "$rel" "out/$s/$s.mp4" "out/$s/$s.meta.json" "out/$s/$s.thumb.png" --clobber && break; echo "upload retry $i"; sleep 20; done || true
              cp "out/$s/meta.json" "checks/$s.meta.json"; cp "out/$s/$s.thumb.png" checks/ || true
              ffmpeg -loglevel error -y -sseof -2 -i "out/$s/$s.mp4" -frames:v 1 -vf scale=480:-1 "checks/$s-end.jpg" || true
              rm -rf "out/$s"
            else
              echo "FAILED $s" | tee -a checks/failed.txt
              cp out/$s/error-*.png checks/ 2>/dev/null || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-checks-${{ strategy.job-index }}
          path: checks/
          retention-days: 14
