name: Video data (real lookups)

# Runs the LinkFinder AI lookups the video factory needs
# (video_factory/tools/run_lookups.py) and commits data/lookups.json.
# Needs the repository secret LINKFINDER_API_KEY.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max lookups this run (0 = all missing)"
        required: false
        default: "0"
      only:
        description: "Comma-separated industry keys (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: video-data
  cancel-in-progress: false

jobs:
  lookups:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key present?
        env:
          K: ${{ secrets.LINKFINDER_API_KEY }}
        run: if [ -z "$K" ]; then echo "::error::LINKFINDER_API_KEY secret is not set"; exit 1; fi; echo "key set"
      - name: Lookups
        env:
          LINKFINDER_API_KEY: ${{ secrets.LINKFINDER_API_KEY }}
        run: python3 video_factory/tools/run_lookups.py --limit "${{ github.event.inputs.limit }}" --only "${{ github.event.inputs.only }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "video-factory-bot"
          git config user.email "video-factory-bot@users.noreply.github.com"
          f=video_factory/data/lookups.json
          cp "$f" /tmp/ours.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 video_factory/tools/merge_lookups.py /tmp/ours.json "$f" > /tmp/merged.json && cp /tmp/merged.json "$f"
            git add "$f"
            git diff --cached --quiet && exit 0
            git commit -q -m "video data: lookups $(date -u +%FT%TZ)"
            git push -q && exit 0
            sleep 5
          done
          exit 1
