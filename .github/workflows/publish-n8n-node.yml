name: Publish n8n node

# Manual only. A push-triggered publish is a trap here: npm version numbers can
# never be reused, so an accidental merge would burn one permanently.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, lint and pack without publishing'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-nodes-linkfinderai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: building this package pulls in n8n-workflow ->
          # @n8n/expression-runtime -> isolated-vm, a native module whose C++ uses
          # v8::SourceLocation and so fails to compile against Node 20's V8 headers.
          # It is a dev/peer dependency only, so consumers are unaffected and
          # package.json's `engines` stays as it is.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Catches the mistake that costs a version number: publishing something
      # already on the registry, or a version that was never bumped.
      - name: Check this version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VER"
          if npm view "$NAME@$VER" version 2>/dev/null; then
            echo "::error::$NAME@$VER is already on npm. Bump the version first."
            exit 1
          fi

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: n8n-nodes-linkfinderai/*.tgz

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
