name: Thumbnails branch

# Copies every long video's <slug>.thumb.png from the video-factory* releases to
# the orphan branch `thumbs`, so vidIQ can fetch it from
# https://raw.githubusercontent.com/eliassaoe/findlinkai/thumbs/<slug>.png
# (vidiq_upload_image refuses the redirecting release URLs). Every video, shorts
# included; Best series as <slug>.jpg (its AI thumbnail, recompressed under 2 MB).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Video factory"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Collect long-video thumbnails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p t
          cd main
          longs=$(python3 -c "
          import glob,os
          for f in glob.glob('video_factory/scenarios/*.json'): print(os.path.basename(f)[:-5])
          ")
          # Best series: its AI thumbnail, as a JPEG under YouTube's 2 MB limit
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import json, urllib.request, io
          from PIL import Image
          for slug, v in json.load(open('video_factory/data/best_thumbs.json')).items():
              try:
                  im = Image.open(io.BytesIO(urllib.request.urlopen(v['url'], timeout=60).read())).convert('RGB')
                  im.thumbnail((1280, 720))
                  im.save(f'../t/{slug}.jpg', 'JPEG', quality=88, optimize=True)
              except Exception as e:
                  print('best thumb failed', slug, e)
          PY
          cd ..
          for r in $(gh release list -R ${{ github.repository }} -L 50 --json tagName -q '.[].tagName' | grep '^video-factory'); do
            gh release download "$r" -R ${{ github.repository }} -p '*.thumb.png' -D "dl-$r" --skip-existing || true
          done
          for s in $longs; do
            f=$(ls -t dl-*/"$s.thumb.png" 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "t/$s.png"
          done
          ls t | wc -l
      - name: Push to the thumbs branch
        run: |
          cd t
          git init -q -b thumbs
          git config user.name "video-factory-bot"
          git config user.email "video-factory-bot@users.noreply.github.com"
          git add -A
          git commit -qm "thumbnails $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" thumbs
