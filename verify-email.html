<script>
// Where Supabase sends people after they click the confirmation link.
//
// The credit top-up is done by the verify-email worker, not here, because this
// page cannot be trusted - it is just a browser tab. All it does is ask the
// worker to check with Supabase and then report what happened. If the link was
// opened on a different device from the one the app is signed in on, there is no
// token here at all; that is fine, because the app re-checks on next load.
const VERIFY_WORKER = 'https://linkfinderai-verify-email.hamoureliasse.workers.dev/';

function show(icon, title, msg, cls) {
  document.getElementById('icon').textContent = icon;
  document.getElementById('title').textContent = title;
  document.getElementById('title').className = cls || '';
  document.getElementById('msg').innerHTML = msg;
}

(async function () {
  var token = null;
  try { token = localStorage.getItem('lf_token_backup'); } catch (e) {}

  if (!token) {
    show('✅', 'Email confirmed',
         'Sign in and your full credit balance will be waiting for you.', 'ok');
    document.getElementById('cta').textContent = 'Sign in';
    document.getElementById('cta').href = '/log-in';
    try { posthog.capture('email_verified', { source: 'landing_no_token' }); } catch (e) {}
    return;
  }

  try {
    const r = await fetch(VERIFY_WORKER + 'claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    });
    const d = await r.json();
    if (r.ok && d.email_verified) {
      const added = d.credits_added || 0;
      show('✅', 'Email confirmed',
           added ? ('Your remaining <strong>' + added + ' credits</strong> have been added to your account.')
                 : 'Your account is fully unlocked.', 'ok');
      try {
        posthog.setPersonProperties({ email_verified: true });
        posthog.capture('email_verified', { source: 'landing', credits_added: added });
      } catch (e) {}
    } else {
      show('⏳', 'Not confirmed yet',
           'The link may have expired. Open the app and use <strong>Send it again</strong> in the banner at the top.', 'bad');
      try { posthog.capture('email_verification_landing_failed'); } catch (e) {}
    }
  } catch (e) {
    show('⚠️', 'Could not reach the server',
         'Your email may still be confirmed. Open the app and check the banner at the top.', 'bad');
    try { posthog.capture('email_verification_landing_failed', { reason: 'network' }); } catch (e) {}
  }
})();
</script>
