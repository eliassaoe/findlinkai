<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlimited Leads</title>
<meta name="description" content="Booked calls, done for you. You describe who you sell to; we do the rest.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  :root{
    --bg:#fbfaf8; --panel:#fff; --line:#e6e2db; --line-soft:#f0ece5;
    --ink:#1a1815; --ink-2:#5c564d; --ink-3:#8a8377;
    --accent:#1c4e3f; --accent-ink:#fff; --accent-soft:#eaf2ef;
    --warn:#8a5a12; --warn-soft:#fdf4e3;
    --hot:#8f2d2d; --hot-soft:#fbeceb;
    --r:10px; --shadow:0 1px 2px rgba(26,24,21,.05),0 8px 24px -16px rgba(26,24,21,.25);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#14130f; --panel:#1c1a16; --line:#302c25; --line-soft:#262319;
    --ink:#f2efe9; --ink-2:#b3ac9f; --ink-3:#847d70;
    --accent:#7fc9ae; --accent-ink:#0f1d18; --accent-soft:#1a2a24;
    --warn:#e5b76a; --warn-soft:#2a2113; --hot:#e8908a; --hot-soft:#2c1a19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
  h1{font-size:1.4rem} h2{font-size:1.1rem} h3{font-size:.95rem}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit;width:100%;padding:.55rem .7rem;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:8px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea{min-height:5.5rem;resize:vertical}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);
    margin:0 0 .3rem;letter-spacing:.01em}
  .hint{font-size:.78rem;color:var(--ink-3);margin:.3rem 0 0}

  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;
    padding:.6rem 1.1rem;font-weight:600;font-size:.9rem}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}

  header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:.75rem 1.25rem;display:flex;align-items:center;gap:1rem}
  .brand{font-weight:650;letter-spacing:-.02em}
  .brand span{color:var(--ink-3);font-weight:400}
  .spacer{flex:1}
  main{max-width:62rem;margin:0 auto;padding:1.75rem 1.25rem 5rem}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:1.15rem 1.25rem;box-shadow:var(--shadow)}
  .stack{display:grid;gap:1rem}
  .grid2{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}

  .pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:650;
    padding:.2rem .55rem;border-radius:999px;letter-spacing:.02em}
  .pill.wait{background:var(--warn-soft);color:var(--warn)}
  .pill.live{background:var(--accent-soft);color:var(--accent)}
  .pill.off{background:var(--line-soft);color:var(--ink-3)}
  .dot{width:.42rem;height:.42rem;border-radius:50%;background:currentColor}
  .dot.pulse{animation:p 1.8s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}

  .stats{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem}
  .stat b{display:block;font-size:1.5rem;font-weight:650;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .stat small{color:var(--ink-3);font-size:.75rem}
  .stat.hi b{color:var(--accent)}

  .tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:0 0 1rem;
    overflow-x:auto}
  .tab{background:none;border:0;padding:.55rem .8rem;font-size:.88rem;font-weight:550;
    color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
  .count{font-size:.72rem;background:var(--line-soft);color:var(--ink-2);
    border-radius:999px;padding:.05rem .38rem;margin-left:.35rem}

  .rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
  .row{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;
    padding:.7rem .9rem;border-bottom:1px solid var(--line-soft);width:100%;
    background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--line-soft)}
  .row .who{font-weight:600;font-size:.9rem}
  .row .meta{color:var(--ink-3);font-size:.78rem;margin-top:.1rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .thread{display:grid;gap:.7rem;margin:0 0 1rem}
  .msg{border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;background:var(--panel)}
  .msg.in{background:var(--accent-soft);border-color:transparent}
  .msg .from{font-size:.75rem;font-weight:650;color:var(--ink-2);margin-bottom:.35rem}
  .msg p{margin:0;white-space:pre-wrap;font-size:.9rem}

  .empty{text-align:center;padding:2.5rem 1.25rem;color:var(--ink-2)}
  .empty h3{margin-bottom:.35rem}
  .empty p{margin:0;font-size:.9rem;color:var(--ink-3);max-width:26rem;
    margin-inline:auto;line-height:1.6}
  .err{background:var(--hot-soft);color:var(--hot);border-radius:8px;
    padding:.6rem .8rem;font-size:.85rem;margin:0 0 1rem}
  .skel{height:1rem;border-radius:4px;background:var(--line-soft);
    animation:s 1.4s ease-in-out infinite}
  @keyframes s{0%,100%{opacity:.55}50%{opacity:.9}}
  .hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Unlimited&nbsp;Leads <span>· booked calls, done for you</span></div>
  <div class="spacer"></div>
  <span id="who" class="hint"></span>
  <button id="signout" class="btn ghost hidden" style="padding:.35rem .7rem;font-size:.82rem">Sign out</button>
</header>

<main id="app"><div class="card"><div class="skel" style="width:40%"></div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
