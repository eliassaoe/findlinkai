name = "unlimited-leads-tenant-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# Flips "Finding leads" to "Sending" on its own, so a customer never sees a
# stale card and you never have to remember to refresh one.
# Optional. Bound, it caps each customer at RATE_LIMIT_PER_MIN requests a
# minute so one broken client cannot spend the organization's shared Explee
# budget. Unbound, the limiter is a no-op and only the cache protects you.
# Create with: wrangler kv namespace create RL
# [[kv_namespaces]]
# binding = "RL"
# id = "REPLACE_WITH_NAMESPACE_ID"

[triggers]
crons = ["*/15 * * * *"]

[vars]
# While the beta runs, point this at wherever beta-auto-gtm.html is served.
ALLOWED_ORIGIN = "https://linkfinderai.com"
RATE_LIMIT_PER_MIN = "60"

# YOUR OWN Explee project ids, comma separated. A campaign in one of these can
# never be linked to a customer — /admin/link refuses it and the status sync
# skips it. Set this BEFORE onboarding anyone. Find the ids with:
#   curl -H "X-API-Key: $EXPLEE_API_KEY" \
#        https://api.explee.com/public/api/v1/autogtm/projects
OWNER_PROJECT_IDS = "30475"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   EXPLEE_API_KEY        Explee → API Keys
#   SUPABASE_URL          https://<project>.supabase.co
#   SUPABASE_SERVICE_KEY  service_role key
#   ADMIN_TOKEN           anything long and random; guards /admin/*
#   BETA_EMAILS           comma-separated allowlist. While set, every /api route
#                         is closed to anyone not on it. Clear it to open the
#                         product to all signups. Set it BEFORE deploying the
#                         page: an unlinked URL is not access control.
#   POSTHOG_KEY           PostHog project API key — sends the hot_lead event
#                         that triggers the notification email. Omit and
#                         notifications are simply off; nothing else changes.
#   POSTHOG_HOST          optional, defaults to https://us.i.posthog.com
#   APP_BASE_URL          optional, defaults to https://unlimited-leads.net —
#                         the inbox link inside the email
