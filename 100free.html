<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>LinkFinder AI</title>
<link rel="canonical" href="https://linkfinderai.com/sign-up">
<!--
  The 1,000-credit campaign landing page was here until 22 Sep 2026. It is gone
  because the offer behind it is gone: coldemail_1000 was public, uncapped, and
  minted 9,991 accounts between 13 and 22 Sep. See docs/incident-signup-farm.md.

  Deleting the file outright would 404 the icp30k_recruiting sequence, which is
  live and whose email 1 links straight here - ~240 real people opened this page
  on 10-12 Sep before the farm found it. So the page is emptied rather than
  removed: no offer, no gift code, no 1,000-credit promise, just a forward to a
  normal signup with the campaign's UTMs intact so attribution still works.

  Note for whoever reads this next: taking this page down does NOT stop the
  abuse, and never would have. By 19 Sep the farm had stopped loading the page
  at all and was posting straight to /sign-up?gift=coldemail_1000 - 3,760
  accounts that day against zero pageviews here. What actually closed it is
  GIFT_CREDITS = {} in workers/signup/worker.js.

  To make it a hard 404 instead: git rm 100free.html. The only cost is the live
  sequence, so check whether it is still sending first.
-->
<script>
  // Clear any gift code an earlier visit left behind, so a stale localStorage
  // value cannot keep asking the Worker for a grant that no longer exists.
  try { localStorage.removeItem('lf_gift'); } catch (e) {}
  var q = window.location.search || '';
  window.location.replace('/sign-up' + q);
</script>
<noscript><meta http-equiv="refresh" content="0; url=/sign-up"></noscript>
</head>
<body><p><a href="/sign-up">Continue to sign up</a></p></body>
</html>
