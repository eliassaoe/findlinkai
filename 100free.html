<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Claim your free credits – LinkFinder AI</title>
<!--
  Landing URL for the cold-email sequence (utm_campaign=icp30k_recruiting).
  It exists so the email can link somewhere short and memorable; it stores the
  gift code and sends the visitor straight to /sign-up, keeping every query
  parameter so attribution (lf-attribution.js) still sees the UTMs there.

  The amount is decided by GIFT_CREDITS in workers/signup/worker.js - change it
  there, not here. To retire the offer, delete the code from the Worker; this
  page can keep existing and people just get the normal grant.
-->
<script src="/js/lf-attribution.js"></script>
<script>
(function () {
  var CODE = 'coldemail_1000';
  try { localStorage.setItem('lf_gift', CODE); } catch (e) {}
  var q = new URLSearchParams(window.location.search);
  q.set('gift', CODE);
  window.location.replace('/sign-up?' + q.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/sign-up?gift=coldemail_1000"></noscript>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#111827;background:#f9fafb}p{font-size:1rem}a{color:#2563eb}</style>
</head>
<body>
<p>Taking you to your free credits… <a href="/sign-up?gift=coldemail_1000">Continue if nothing happens</a></p>
</body>
</html>
